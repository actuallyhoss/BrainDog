# One command: `cp selfhost.env.example .env`, fill in the two values it asks for, then `docker compose up -d`.
# The record lives in the named volume, so `docker compose down` keeps it; `down -v` deletes it.
# BRAINDOG_PORT in .env moves the port on your machine, and the address the server names follows it.
# The build context is this folder: keep backups out of it (apps/selfhost/README.md, Backups).
services:
  braindog:
    build:
      context: .
      dockerfile: apps/selfhost/Dockerfile
    image: braindog
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BRAINDOG_PORT:-8080}:8080"
    volumes:
      - braindog:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  braindog:
