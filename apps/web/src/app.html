<!doctype html>
<html lang="en-GB">
  <head>
    <!-- FIRST, always. The only thing that stops the white UA canvas painting before the stylesheet
         parses, and the thing that governs UA scrollbars and form controls (28 §5 mechanism 1). -->
    <!-- `en-GB`, not `en`. It governs hyphenation, spellcheck dictionaries and how a screen reader
         pronounces the page.

         IT DOES NOT GOVERN THE DATE INPUT, and an earlier version of this comment said it did.
         Measured: with `lang="en-GB"` on the document AND `en-GB` as the browser locale, Chromium
         still renders `<input type="date">` as `mm/dd/yyyy` — the format follows the browser's own
         UI language and nothing the page can set.

         Which turns out to be correct behaviour rather than a bug to fix. A native date input shows
         each reader the order their own browser is set to, so it always matches what they read
         dates in; and the app's own rendered dates spell the month as a word — `27 Jul 2026` — so
         they are unambiguous in every locale and there is no pair to disagree. -->
    <meta name="color-scheme" content="light dark" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- A PHONE'S OWN BAR TAKES THE APP BAR'S COLOUR: `--nav`, white in light and the crimson in dark, for the device's own
         scheme before anything runs; `lib/phone/device.ts` follows a scheme or palette chosen in Settings. An iPhone
         opened from the Home Screen draws its status bar in it (`default`, dark letters on light and light on dark),
         and BrainDog is the app's name under its icon. -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BrainDog" />
    <!-- `not just code`, AND IT SAID `isn't code`. The rest of the product was changed to match it: a repository, a deploy and a bug are all things a
         record holds, and what it is not is a place to keep the code itself. "Isn't code" reads as
         a boundary the product does not have, and it tells a developer their work is out of scope.
         This one line was missed, in the one place nobody reads and every crawler does. -->
    <meta name="description" content="One place for your projects, decisions and money, shared by you and your AI agents." />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32" />
    <!-- THE TAB DRAWS THE SMALL MARK (`MARK_SMALL`), on the 16-pixel grid a tab shows it on; `mark.svg` is the whole mark. -->
    <link rel="icon" href="%sveltekit.assets%/mark-small.svg" type="image/svg+xml" />
    <!-- THE MANIFEST IS WHAT LETS AN IPHONE BE TOLD AT ALL. Safari delivers Web Push only to a site added to the Home
         Screen whose manifest says `standalone`; Android Chrome needs neither, so for it this line changes nothing but
         the install prompt. That is platform knowledge, not measured on a phone here. It is scoped to the app's own path and never to the marketing site beside it on the same
         host, and `push.test.ts` holds this line and the file's scope. -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <!-- AND THE ICON THAT PHONE IS GIVEN IS THIS ONE, NOT THE MANIFEST'S. Safari takes the Home Screen icon from
         `apple-touch-icon` only, and as a PNG, so the manifest's SVG left an iPhone with no icon of ours to use. That is
         platform knowledge and was not measured on a phone here. 180 pixels square on the house ground `#F7F5F3`, because iOS fills a transparent icon with black. It was drawn
         from `mark.svg` once, by hand, and is not regenerated by the skin's `theme.mjs` as the favicon is. -->
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <!-- THE ONE FACE EVERY FIRST SCREEN DRAWS, ASKED FOR WITH THE PAGE. Without it a font was found only once the
         layout's stylesheet had loaded and a heading had been laid out, so the text drew in the fallback first and
         moved when the face arrived. The address is `lib/ui/style.css`'s, query and all, or the browser fetches twice;
         `lib/fonts.test.ts` holds them equal. `crossorigin` because a font is always fetched in CORS mode, and a
         preload made without it is not the request the stylesheet makes. Geist Mono and Arabic stay unpreloaded:
         a page asks for them only when it draws one. -->
    <link rel="preload" href="%sveltekit.assets%/fonts/jakarta.woff2?v=a49d" as="font" type="font/woff2" crossorigin />

    <!--
      THE FALLBACKS ARE SIZED TO THE FACES, SO NOTHING MOVES WHEN THEY ARRIVE. Until a webfont lands the text is drawn
      in Arial, which is on every Mac, iPhone and Windows machine, and Arial is narrower and sits lower than either face:
      a title wrapped differently and every line under it jumped when Lexend swapped in. Each fallback is Arial scaled
      to its face's width and given its face's ascent and descent, so the swap changes the letters and not the layout.
      `tokens.css` names them second in its stacks.

      MEASURED, NOT GUESSED. `size-adjust` is the width of the same English and UI text in the face over its width in
      Arial, in Chromium (Geist 400 1.018 and 500 1.041 against Arial; Lexend 600 1.053 against Arial Bold). The
      overrides are each face's own ascent and descent (Geist 1005 and 295, Lexend 1000 and 250, per 1000) divided by
      that scale. Each covers its face's characters only, so Arabic still goes to Plex and a title's odd character to
      Geist. Where there is no Arial the next family in the stack draws, as before.

      HERE AND NOT IN `tokens.css`, because they are the first frame's, and because the entry stylesheet is held to
      12 KB with less room left than these take.
    -->
    <style>
      /* PLUS JAKARTA SANS, the one face since 3 Nov (`lib/ui/style.css`): Arial widened to its stance, ONE FACE PER WEIGHT
         (ui-perfect, 3 Nov; measured again 4 Nov on the file `tools/fonts/jakarta.py` builds). With one regular face the
         fallback drew 500 and 600 at the regular's width, and a title at 600 narrowed 2.2% and rewrapped when Jakarta
         landed. Measured in Chromium over ten UI strings: Jakarta 400 is 106.8% of Arial, 500 is
         107.9% of Arial, 600 is 102.5% of Arial Bold; ascent 1.0 and descent 0.26 em over each scale. Latin and the
         arrows only, so Arabic still goes to Plex. */

        src: local('Arial'), local('ArialMT');
        font-weight: 100 450;
        size-adjust: 106.8%;
        ascent-override: 93.63%;
        descent-override: 24.34%;
        line-gap-override: 0%;
        unicode-range: U+0000-017F, U+2000-206F, U+20AC, U+2122, U+2190-2193, U+2212;
      }

      @font-face {
        font-family: 'Jakarta Fallback';
        src: local('Arial'), local('ArialMT');
        font-weight: 451 550;
        size-adjust: 107.9%;
        ascent-override: 92.68%;
        descent-override: 24.1%;
        line-gap-override: 0%;
        unicode-range: U+0000-017F, U+2000-206F, U+20AC, U+2122, U+2190-2193, U+2212;
      }

      @font-face {
        font-family: 'Jakarta Fallback';
        src: local('Arial Bold'), local('Arial-BoldMT');
        font-weight: 551 900;
        size-adjust: 102.5%;
        ascent-override: 97.56%;
        descent-override: 25.37%;
        line-gap-override: 0%;
        unicode-range: U+0000-017F, U+2000-206F, U+20AC, U+2122, U+2190-2193, U+2212;
      }

      @font-face {
        font-family: 'Geist Fallback';
        src: local('Arial'), local('ArialMT');
        size-adjust: 102.5%;
        ascent-override: 98.05%;
        descent-override: 28.78%;
        line-gap-override: 0%;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Lexend Fallback';
        src: local('Arial Bold'), local('Arial-BoldMT');
        font-weight: 600;
        size-adjust: 105.3%;
        ascent-override: 94.97%;
        descent-override: 23.74%;
        line-gap-override: 0%;
        unicode-range: U+0020-007E, U+00B7, U+2013, U+2018-2019, U+201C-201D, U+2026;
      }
    </style>

         A static shell has no server to write the attributes, so this reads the per-device
         preference cookie and sets them before first paint (50 §4.7).

         `data-theme` IS THE HIGH-CONTRAST PALETTE AND NOTHING ELSE. It used to be stamped with the
         record accent, which bought nothing: `accent.ts` builds its palette into an adopted
         stylesheet, and there is no CSS rule anywhere that reads a `data-theme` other than `hc`. It
         cost something, though. `house.css` matches `html[data-theme='hc']` for a whole generated
         palette solved against a higher contrast floor, and an accent overwrote it. -->

      rail waited for the network twice in turn. This asks for it the moment the page parses, at the address the app
      will ask (`apiBase` in `lib/at.ts`: the slug is the address's first word, unless that word is one of the
      app's own, `APP_WORDS`, or a spoken handle), and `readBoot` takes the answer once, only for that address.

      THE WORDS ARE `APP_WORDS` AGAIN, and `boot-live-early.test.ts` holds the two lists and the two patterns equal. A
      guess that is wrong costs one unread answer and nothing else: the app asks at its own address as it always did.

      `boot-live.ts` takes once: Today learnt its lists only after `boot` had named them, five round trips before its
      page could be asked. Held to the reader by the record as `boot` is; an address guessed wrong leaves it unread.

      under 720px, as Home's own `narrow`, or wider): Today's body is built only once the shell's code, `boot` and the
      lists have landed, one whole round trip before it could be asked (finish S2). The answer says what it drew

      always did otherwise. Never while the tab sees the record as somebody else (`see-as.svelte.ts`). ITS BODY IS READ

      AND ON A PAGE OPENED BY ITS ADDRESS (`/p/<slug>`, nothing after it), THAT PAGE (`page` with `shape`), as the
      page's reader asks it first (`pageReader` in `record/page-live.ts`), which takes it once, only for that address:

      back 401, two console errors on every first visit. The layout asks nothing there either (`+layout.ts`).

      AND FOR SOMEBODY THIS DEVICE KNOWS MAY ONLY ADD (`bd_add_only`, the boot address), `whoami` AND NOTHING ELSE: every
      read here was a 403 for her, `boot` too, and `whoami` answers her (`readBoot` takes it, collab pass 4).
      AND THE SAME ON A DEVICE THAT HAS NEVER SEEN `boot` ANSWER THE READER (`bd_reads`, final polish): her very first open

      THE FIRST PAINT WAS A BLACK RECTANGLE, MEASURED AT UP TO 2.5 SECONDS.

      `+layout.ts` sets `ssr = false` and `50 §13 D1/D2` means it: one `build/`, host-agnostic, no
      server renders a request. That decision is not in question here. What follows from it is that
      the body is empty until the bundle boots, and a friction pass measured fifteen of fifteen
      routes returning the identical shell with a DOMContentLoaded of 2,526ms.

      SO THE SHELL DRAWS THE SHAPE OF ITSELF, `#ff` at the foot of this file: the ground, the sidebar's tile or the phone's
      tab bar, the bar's field and presses, and the page's own outline as it last landed (`lib/shell/page-trace.ts`). Not a
      spinner, which says something is happening and nothing else.

      AND NOTHING IN THIS FILE MAY SPELL A KIT PLACEHOLDER, WHICH IS HOW THE FIRST VERSION OF THIS
      COMMENT BROKE THE WHOLE APP. It quoted the body placeholder, in prose, to explain itself.
      SvelteKit substitutes the FIRST occurrence and leaves the rest: the comment was filled with the
      app and the real one, in the body below, shipped as literal text. Measured: `main#main` absent
      from every route, thirty-nine elements on the page, no console error, no page error, an empty
      screen. It went to staging and served there.

      So the two names are written apart in prose here, `sveltekit` and `body` in separate words,
      and the only complete spellings in this file are the two that are meant to be replaced.
    -->

      real tokens, behind everything (`z-index: -1`), so what the app draws lands over it. The sidebar's tile and the bar
      stand until the real ones are there, by `:has()`, so nothing runs or is timed for that. Their numbers are
      `AppFrame.svelte`'s, `SideBar.svelte`'s, `TopBar.svelte`'s and `TabBar.svelte`'s. THERE IS NO TOP BAR: it had a white strip 56
      tall here until 4 Nov, the shape of a layout the app stopped drawing, and that was the flash on a reload.

      THE PAGE'S OWN WAITS STAND BACK WHILE ITS OUTLINE IS UP (`data-ff`): holding their room, unseen, so two pictures of
      the page are never on screen at once.
    -->
