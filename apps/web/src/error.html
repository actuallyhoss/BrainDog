<!doctype html>
<html lang="en-GB">
  <head>
    <!--
      WHAT A START THAT FAILED DRAWS (the scope of 24 October, E42; fluid F17): when the app's own code cannot be
      fetched, SvelteKit cannot draw `+error.svelte` and draws this page instead. It drew the browser's bare "500
      Internal Error" until then.

      IT TRIES AGAIN BY ITSELF FIRST (24 November): "Loading BrainDog…" while the page reloads, three times 1.5 seconds
      apart, and only then "BrainDog didn't load" with its one button. `#start`'s `data-state` says which, and
      `lib/data/chunk-fail.ts` (`startFailed`) sets it from the router's error hook, because nothing written here runs:
      SvelteKit parses this page and moves its head and body into the document, which runs no script, and the policy
      would refuse an inline one. With no state set, as when that module could not be fetched either, the loading line
      gives way to the failure after eight seconds by this stylesheet alone, and the button's form asks for the page again.

      THE SYSTEM'S OWN GROUND AND INK, LIGHT AND DARK, AND ONE LITERAL COLOUR. This page is drawn when the app's
      stylesheet has not arrived, so it cannot read a token; `Canvas` and `CanvasText` follow the reader's light or
      dark, and the scheme chosen in Settings (`data-scheme`, which stays on the root), and the page's few tokens are
      mixed from them. The one colour written down is the mark's, `--brand`, the theme's red, held equal to it with the
      mark's drawing by `error-html.test.ts`.

      ITS STYLESHEET IS HASHED IN THE POLICY (`svelte.config.js`), as the shell's own are: unhashed it was refused, and
      the page drew in the browser's serif with a blue link.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BrainDog</title>
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: url('/fonts/jakarta.woff2?v=a49d') format('woff2');
        font-weight: 200 800;
        font-display: swap;
      }

      /* The page's own names, so nothing a theme left on the document (`adoptedStyleSheets`) can reach them. */
      :root {
        color-scheme: light dark;
        --brand: #CF413A;
        --start-red: light-dark(var(--brand), color-mix(in oklab, var(--brand) 90%, Canvas));
        --start-red-hover: color-mix(in oklab, var(--start-red) 88%, CanvasText);
        --start-on-red: light-dark(Canvas, CanvasText);
        --start-board: light-dark(color-mix(in oklab, CanvasText 4%, Canvas), Canvas);
        --start-tile: light-dark(Canvas, color-mix(in oklab, CanvasText 8%, Canvas));
        --start-ink: CanvasText;
        --start-ink-2: color-mix(in oklab, CanvasText 68%, Canvas);
        --start-well: color-mix(in oklab, CanvasText 6%, transparent);
        --start-ctl-h: 32px;
      }

      :root[data-scheme='light'] {
        color-scheme: light;
      }

      :root[data-scheme='dark'] {
        color-scheme: dark;
      }

      /* A FINGER GETS 44, as every control of the app does under a coarse pointer. */
      @media (pointer: coarse) {
        :root {
          --start-ctl-h: 44px;
        }
      }

      html,
      body {
        margin: 0;
        background: var(--start-board);
        color: var(--start-ink);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* BOTH STATES IN ONE CELL, CENTRED, so neither moves the other: the one not drawn is hidden from a screen reader too. */
      main {
        box-sizing: border-box;
        min-block-size: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }

      .state {
        grid-area: 1 / 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .failed,
      #start[data-state='failed'] .loading {
        visibility: hidden;
      }

      #start[data-state='failed'] .failed {
        visibility: visible;
      }

      #start:not([data-state]) .failed {
        animation: start-show 0s 8s forwards;
      }

      #start:not([data-state]) .loading {
        animation: start-hide 0s 8s forwards;
      }

      @keyframes start-show {
        to {
          visibility: visible;
        }
      }

      @keyframes start-hide {
        to {
          visibility: hidden;
        }
      }

      /* THE MARK IN A NEUTRAL WELL, as the app frames a screen's glyph (`IconWell`): 56 square at the tile's radius. */
      .well {
        display: grid;
        place-items: center;
        inline-size: 56px;
        block-size: 56px;
        border-radius: 16px;
        background: var(--start-well);
      }

      .mark {
        display: block;
        inline-size: 31px;
        block-size: 24px;
        fill: var(--start-red);
      }

      /* WHILE IT TRIES AGAIN, the well breathes as the first frame does, and keeps still for a reader who asked for less motion. */
      .loading .well {
        animation: start-breath 2.4s ease-in-out 0.6s infinite;
      }

      @keyframes start-breath {
        50% {
          opacity: 0.55;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading .well {
          animation: none;
        }
      }

      .loading p {
        margin: 12px 0 0;
        color: var(--start-ink-2);
        font-size: 15px;
        line-height: 22px;
      }

      /* THE FAILURE, ONE TILE ON THE BOARD as the app's whole-screen states are: the well, the name, one line, one action. */
      .failed {
        box-sizing: border-box;
        inline-size: min(100%, 400px);
        padding: 32px 24px 28px;
        border-radius: 16px;
        background: var(--start-tile);
      }

      h1 {
        margin: 16px 0 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 28px;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }

      .failed p {
        margin: 8px 0 0;
        max-inline-size: 32ch;
        color: var(--start-ink-2);
        font-size: 15px;
        line-height: 22px;
        text-wrap: pretty;
      }

      form {
        margin: 20px 0 0;
      }

      /* THE APP'S PRIMARY BUTTON: a capsule in the red with white words, 14 medium, 16 either side, a fill under the pointer. */
      button {
        box-sizing: border-box;
        min-block-size: var(--start-ctl-h);
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: var(--start-red);
        color: var(--start-on-red);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        line-height: 20px;
        cursor: pointer;
        transition: background-color 70ms ease-out;
      }

      button:hover {
        background: var(--start-red-hover);
      }

      button:focus-visible {
        outline: 2px solid var(--start-ink);
        outline-offset: 2px;
      }

      @media (width < 640px) {
        .failed {
          padding: 28px 16px 24px;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <symbol id="start-mark" viewBox="0 0 997.34 775.17">
          <path d="M498.69,345c-18.16,0-32.84-14.67-32.84-32.79s14.67-32.84,32.84-32.84,32.79,14.68,32.79,32.84-14.68,32.79-32.79,32.79Z" />
          <path d="M996.77,417.5c-6.88,83.35-76.86,150.09-160.36,156.58-24.46,1.89-46.2-.92-69.89-5.28-9.78,33.52-32.06,59.57-62.62,75.12-14.74,7.33-29.75,12.77-44.89,16.5-9.22,2.27-18.73,3.34-28.21,2.79-67.92-3.98-100.24-66.41-100.24-66.41,0,0-48.09-110.28,77.01-159.97,125.05-49.74,118.66-131.49,118.66-131.49v-72.21c0-6.59-6.1-11.43-12.5-10.03l-135.42,29.93c-2.81.63-5.81,0-8.14-1.65l-31.19-22.09c-2.32-1.65-5.13-2.23-7.89-1.74l-88.63,17.19c-3.97.73-7.99-.87-10.32-4.17l-60.93-85.58c-5.81-8.19-18.65-4.07-18.65,5.96v514.7c0,57.66-48.91,103.77-106.39,99.2-.47-.04-.94-.08-1.42-.12-61.27-8.19-94.64-56.57-97.4-118.32-83.16-18.11-138.61-101.66-110.18-184.82-41.7-38.31-48.09-99.63-20.34-148.54,13.75-24.26,31.43-43.73,51.53-63.35,4.36-83.45,74-147.82,155.08-150.14,8.09-20.34,20.44-35.65,36.08-49.79C316.83,11.01,399.31-4.97,469.15,23.75c67.51-39.57,151.21-28.28,208.07,23.39,67.56.44,127.18,28.91,151.84,92.65,84.56,6.1,149.27,80.45,131.06,165.64,27.99,30.03,40.1,69.6,36.66,112.07Z" />
      </symbol>
    </svg>
    <main id="start">
      <div class="state loading" role="status">
        <span class="well"><svg class="mark" aria-hidden="true"><use href="#start-mark" /></svg></span>
        <p>Loading BrainDog…</p>
      </div>
      <section class="state failed" aria-labelledby="start-title">
        <span class="well"><svg class="mark" aria-hidden="true"><use href="#start-mark" /></svg></span>
        <h1 id="start-title">BrainDog didn't load</h1>
        <p>Check your connection and try again. Nothing in your BrainDog was lost.</p>
        <form><button>Try again</button></form>
      </section>
    </main>
  </body>
</html>
