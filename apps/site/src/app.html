<!doctype html>
<html lang="en-GB">
  <head>
    <!-- FIRST, always. The only thing that stops the white UA canvas painting before the stylesheet
         parses, and the thing that governs UA scrollbars and form controls. -->
    <meta name="color-scheme" content="light dark" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%sveltekit.assets%/mark.svg" type="image/svg+xml" />

    <!-- NO PREFERENCE COOKIE HERE, unlike the app. This site has no account and sets no cookie, so
         the scheme is whatever the operating system says. That is also the honest default for a
         page somebody arrives at once, from a search result, having never chosen anything.

         This comment ships in the bytes, so it holds to the same rule the copy does: no em dashes
         anywhere in the served HTML, which is a thing `grep` can check rather than a thing somebody
         has to remember. -->
    <!--
      THE SHARED CARD. Pasted into a message, a post or a chat, a page shows this preview rather than
      a bare URL.

      IN THE SHELL, the parts that do not vary: the site name, the type, the card format and the
      image. Each page sets its own `og:title` and `og:description` from its own `<title>` and
      description in its `+page.svelte`, so there is one sentence per page and not two that can
      disagree.

      `og:image` IS A DRAWN CARD AND NOT A SCREENSHOT: the mark, the wordmark and the slogan on the
      hero's own ground, 1200 by 630, which `scripts/product.mjs` draws out of the built home page, so
      its words, faces and colours are the site's. An absolute URL, because a preview is fetched by
      somebody else's server and a relative one resolves against nothing.
    -->
    <meta property="og:site_name" content="BrainDog" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://brain.dog/shots/home-light.png" />
    <meta name="twitter:card" content="summary_large_image" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
