<!doctype html>
<html lang="en-GB">
  <head>
    <!-- FIRST, always. The only thing that stops the white UA canvas painting before the stylesheet
         parses, and the thing that governs UA scrollbars and form controls. -->
    <meta name="color-scheme" content="light dark" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%sveltekit.assets%/mark.svg" type="image/svg+xml" />

    <!-- NO PREFERENCE COOKIE HERE, unlike the app. This site has no account and sets no cookie, so
         the scheme is whatever the operating system says. That is also the honest default for a
         page somebody arrives at once, from a search result, having never chosen anything.

         This comment ships in the bytes, so it holds to the same rule the copy does: no em dashes
         anywhere in the served HTML, which is a thing `grep` can check rather than a thing somebody
         has to remember. -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
