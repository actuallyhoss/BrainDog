<!doctype html>
<html lang="en-GB">
  <head>
    <!-- FIRST, always. The only thing that stops the white UA canvas painting before the stylesheet
         parses, and the thing that governs UA scrollbars and form controls. -->
    <meta name="color-scheme" content="light dark" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- THE TWO FACES EVERY PAGE OPENS IN, asked for first, ahead of the page's modules, so the text is drawn in them
         the first time and nothing moves when they land (the founders' page shifted 0.06 on a phone). The same
         addresses as `tokens.css`, version and all, or the browser fetches each twice; `crossorigin` because fonts are
         always fetched that way. Geist Mono and Plex are left to load when a page uses them. -->
    <link rel="preload" href="/fonts/geist.woff2?v=494f" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/lexend-600.woff2?v=7865" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32" />
    <!-- THE TAB DRAWS THE SMALL MARK (`MARK_SMALL`), on the 16-pixel grid a tab shows it on; `mark.svg` is the whole mark. -->
    <link rel="icon" href="%sveltekit.assets%/mark-small.svg" type="image/svg+xml" />

    <!-- NO PREFERENCE COOKIE HERE, unlike the app. This site sets no cookie, so the scheme is whatever
         the operating system says. That is also the honest default for a page somebody arrives at once,
         from a search result, having never chosen anything.

         IT READS ONE, and only one: bd_in, which the app sets beside its session and clears at sign-out,
         holding the record's address and nothing that signs anyone in. The script below reads it before the first
         paint and marks the page signed in, so "Start free" and "Sign in" become "Open BrainDog" with
         nothing flickering. A file and not an inline script, because the CSP allows only this origin's
         scripts; tiny and blocking on purpose (src/lib/site/signed-in.ts says what it mirrors).

         This comment ships in the bytes, so it holds to the same rule the copy does: no em dashes
         anywhere in the served HTML, which is a thing `grep` can check rather than a thing somebody
         has to remember. -->
    <script src="/signed-in.js"></script>
    <!-- The visit count (src/lib/site/seen.ts): deferred, so it never holds up the first paint. -->
    <script src="/seen.js" defer></script>
    <!--
      THE SHARED CARD. Pasted into a message, a post or a chat, a page shows this preview rather than
      a bare URL.

      IN THE SHELL, the parts that do not vary: the site name, the type, the card format and the
      image. Each page sets its own `og:title` and `og:description` from its own `<title>` and
      description in its `+page.svelte`, so there is one sentence per page and not two that can
      disagree.

      `og:image` IS A DRAWN CARD AND NOT A SCREENSHOT: the mark, the wordmark and the slogan on the
      hero's own ground, 1200 by 630, which `scripts/product.mjs` draws out of the built home page, so
      its words, faces and colours are the site's. An absolute URL, because a preview is fetched by
      somebody else's server and a relative one resolves against nothing.
    -->
    <meta property="og:site_name" content="BrainDog" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://brain.dog/shots/home-light.png" />
    <meta name="twitter:card" content="summary_large_image" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
