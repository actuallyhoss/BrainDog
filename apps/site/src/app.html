<!doctype html>
<html lang="en-GB">
  <head>
    <!-- FIRST, always. The only thing that stops the white UA canvas painting before the stylesheet
         parses, and the thing that governs UA scrollbars and form controls. -->
    <meta name="color-scheme" content="light dark" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- THE TWO FACES EVERY PAGE OPENS IN, asked for first, ahead of the page's modules, so the text is drawn in them
         the first time and nothing moves when they land (the founders' page shifted 0.06 on a phone). The same
         addresses as `tokens.css`, version and all, or the browser fetches each twice; `crossorigin` because fonts are
         always fetched that way. Geist Mono and Plex are left to load when a page uses them. -->
    <link rel="preload" href="/fonts/geist.woff2?v=494f" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/lexend-600.woff2?v=7865" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32" />
    <!-- THE TAB DRAWS THE SMALL MARK (`MARK_SMALL`), on the 16-pixel grid a tab shows it on; `mark.svg` is the whole mark. -->
    <link rel="icon" href="%sveltekit.assets%/mark-small.svg" type="image/svg+xml" />

    <!-- THE SCHEME IS THE APP'S. With nothing chosen it is the operating system's. A scheme (or high contrast) chosen in
         BrainDog's Settings lives in the app's `bd_pref` cookie, and where this page can read it the script below puts
         it on the page before the first paint (`data-scheme`, `data-theme`) exactly as the app's shell does. The app
         writes that cookie for its own host today; once it writes it for brain.dog, as the Worker writes `bd_in`, the
         site wears the chosen scheme with no change here. It also reads `bd_in`, which the app sets beside its session,
         and marks the page signed in, so "Get early access" and "Sign in" become "Open BrainDog" with nothing
         flickering. It sets no cookie. A file and not an inline script, because the CSP allows only this origin's
         scripts; tiny and blocking on purpose (src/lib/site/signed-in.ts says what it mirrors).

         This comment ships in the bytes, so it holds to the same rule the copy does: no em dashes anywhere in the
         served HTML, which is a thing `grep` can check rather than a thing somebody has to remember. -->
    <script src="/signed-in.js"></script>
    <!-- The visit count (src/lib/site/seen.ts): deferred, so it never holds up the first paint. -->
    <script src="/seen.js" defer></script>
    <!--
      THE SHARED CARD. Pasted into a message, a post or a chat, a page shows a preview rather than a bare URL.
      Here are only the parts that never vary: the site's name and the card's format. Each page's title, description,
      address and picture (1200 by 630, drawn by `scripts/product.mjs` from that page's own head) come from
      `lib/site/Seo.svelte`, with its structured data, so there is one sentence per page and not two that can disagree.
    -->
    <meta property="og:site_name" content="BrainDog" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
