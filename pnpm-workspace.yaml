packages:
  - packages/*
  - apps/*
  # A SHARED PACK IS A WORKSPACE, SO `pnpm test` RUNS ITS TEST. `packs/<id>/` holds a feature that is data on
  # the record's primitives rather than code in the shell. Without this line a pack's test is a file nothing runs,
  # and the first time anybody learns that a kernel change broke a pack is when it refuses to install.
  - packs/*
minimumReleaseAge: 1440
linkWorkspacePackages: false
# WHICH DEPENDENCIES MAY RUN A BUILD SCRIPT, DECIDED RATHER THAN APPROVED.
#
# pnpm 10 refuses to run a package's `postinstall` until it is named here, which is the right
# default: a build script is arbitrary code executing at install time with the developer's
# permissions, and it is the shortest path a supply-chain attack has. `pnpm approve-builds` writes
# this list interactively, which means the decision lives in one person's terminal history; writing
# it here puts it in the diff, where the next reader can ask why.
#
# Three, and each earns it by needing a platform binary that cannot be shipped as portable
# JavaScript:
#
#   esbuild   the bundler wrangler runs. A Go binary per platform.
#   workerd   the Workers runtime itself, for `wrangler dev` and the deploy's own bundling.
#   sharp     libvips, which generates the favicons from the mark (`packages/skin/scripts`).
#
# A fourth name appearing here is a thing to look at, not a box to tick. It was previously left as
# three literal `set this to true or false` strings, which is neither an approval nor a refusal:
# every install printed the same warning and nobody read it.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# WHERE A TRANSITIVE VERSION IS DECIDED HERE RATHER THAN BY WHOEVER DEPENDS ON IT.
#
# An override is a claim that this repository knows better than a package's own manifest, so each
# one says which advisory it answers and what it would cost to drop it. The right fix for any of
# these is the dependency shipping a bumped range; an override is what holds the line until it does.
#
#   cookie   GHSA-pxg6-pf52-xh8x. `cookie` before 0.7.0 accepts a name, path or domain containing
#            out-of-bounds characters, so a caller that concatenates untrusted input into one can
#            write a second cookie. `@sveltejs/kit@2.70.3` asks for `^0.6.0` and pins 0.6.0.
#
#            THE EXPOSURE HERE IS SMALL AND THAT IS NOT THE ARGUMENT. This app is `ssr = false` and
#            static, so the server-side cookie path barely runs, but "we do not use the vulnerable
#            path" is a claim about today's code that nobody re-checks, and the fix is a range bump
#            that costs nothing. 0.7.x is the same API with the validation added; 1.x and 2.x change
#            the signature `kit` calls.
#   sharp    GHSA-rgj7-g3m4-5g8c. `sharp` before 0.35.4 bundles a libheif with two vulnerabilities of
#            its own. It arrives twice: `packages/skin` uses it to generate the favicons from the
#            mark, and `wrangler` pulls it through `miniflare`. Neither path decodes an image a
#            stranger sent (one reads a mark in this repository and the other is a dev server), but
#            a bundled native decoder is precisely the dependency whose blast radius is not obvious
#            from the call site, and 0.35.4 is a patch release of the version already installed.
#   undici   A medium advisory on 7.28.0 up to 7.29.1. It arrives through `wrangler` and `miniflare` for
#            the dev server and deploys, never in what a browser or a record runs; the patched 7.x is the
#            same API, so the range holds until those packages ask for it themselves.
overrides:
  cookie: ^0.7.2
  sharp: ^0.35.4
  undici: ^7.29.1
