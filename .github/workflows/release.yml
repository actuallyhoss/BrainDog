name: release

# TWO KINDS OF RELEASE, BECAUSE THIS REPOSITORY SHIPS TWO KINDS OF THING, and 52 §5.6 already
# decided which is which: **the app has no semver**. Its version is `app <YYYY.MM.DD>+<sha7>`, a
# date and a commit, because nothing about a record that is served from one deployment is promised
# by a minor number — there is no consumer to promise it to. Only the packages that go on a registry
# carry semver, and their lines are independent of each other and of every record number.
#
#   v2026.09.08          the app: the browser client, the site, the hosts. A second one on the same
#                        day is `v2026.09.08.2`.
#   render-v0.1.0        `braindog-render` on npm — semver, because a dependent's build depends on it
#   cli-v0.1.0           `braindog-cli` on npm — the same
#
# THE TAG IS THE TRIGGER AND `pnpm release` IS THE GESTURE. 52 §2 puts `tools/release.mjs` on a
# developer's machine: it asserts a clean tree on master, writes the version, commits, tags and
# pushes the tag. That script is not in this tree yet, so today the gesture is `git tag v2026.09.08
# && git push origin v2026.09.08`; this workflow is the same either way, because what it reacts to
# is the tag.
#
# THE NOTES ARE THE COMMIT SUBJECTS, and this repository is unusual in that they are worth reading:
# *"secret-grep caught one leak shape in seven, and the one it missed most is the record"* is a
# release note already. `git log --format='- %s'` takes the SUBJECT ALONE, so trailers — sign-offs,
# co-authors, session links, anything a tool appended below the blank line — never reach the notes.
# That is deliberate and it is the mechanism: the notes are what the author wrote about the change,
# and nothing else.
#
# NO CHANGELOG.md, and there is a reason beyond not having one yet. `apps/site/src/routes/changelog`
# is a curated, dated, human-written page whose own comment says entries are "the repository's own,
# in its own words" — the artefact 14 §5 calls proof of life. A generated file of commit subjects
# committed beside it would be a second changelog that disagrees with the first within a month. The
# GitHub release IS the developer-facing log; the site's page stays hand-written.
#
# `gh` AND NOT A MARKETPLACE ACTION. `softprops/action-gh-release` is one line shorter and is a
# third-party dependency with a write token in a release job, which is the worst place in this
# repository to add one. `gh` is on the runner, authenticated by `GITHUB_TOKEN`, and 52 §8 already
# caps the marketplace at four actions.

on:
  push:
    tags:
      - 'v2*' # the app: `v<YYYY.MM.DD>[.n]`, and this repository's years begin with 2
      - 'render-v*'
      - 'cli-v*'

permissions:
  contents: read

concurrency:
  # NEVER CANCEL A RELEASE. A tag push is a decision somebody made once; killing it half-way leaves
  # a tag with no release, or a registry with a version this workflow did not verify.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # A TAG CAN BE CUT FROM ANY COMMIT, including one `ci.yml` never saw. Cheap insurance: the suite
  # and the source gates, on the tagged tree, before anything is published or written down. The
  # browser gates are not here — `gates.yml` owns them, and nineteen minutes between a tag and a
  # release is nineteen minutes in which the tag exists and the release does not.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test
      # `typecheck` is NOT excluded here as it is in `ci.yml`: `run.mjs` runs it first, and this job
      # has no separate typecheck step to duplicate.
      - run: pnpm gates -- --except bundle,keys,prefs,layout,a11y

  app:
    needs: verify
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # The only `write` in this repository's workflows, and it is scoped to the job that creates
      # the release rather than declared at the top of the file.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes are `git log <previous tag>..<this tag>`, and a shallow clone has neither.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # 52 §5.6's version tuple: `app <YYYY.MM.DD>+<sha7>`. NOTHING READS IT YET — no source file in
      # the tree mentions `BRAINDOG_BUILD`, so today the build ignores it. It is set because the
      # tuple is specified, because this is the only place the date and the commit are both known,
      # and because the alternative is discovering on the day `/api/version` is built that the
      # release workflow never carried it.
      - name: the build tuple
        env:
          TAG: ${{ github.ref_name }}
        run: echo "BRAINDOG_BUILD=${TAG#v}+$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - run: pnpm --filter @braindog/web build

      # The build regenerates `tokens.css` and the favicons — see `ci.yml`. A release is the last
      # place to ship a palette a person has not reviewed.
      - run: git diff --exit-code

      # THE ONLY THING AN APP RELEASE CAN HAND ANYBODY. `apps/web/build` is a static SPA and it is
      # git-ignored, so without an asset the tag is a pointer to a commit somebody else has to build.
      # The site is not here: it is deployed, not released, and a tarball of a marketing site is an
      # artefact with no consumer.
      - name: pack the built shell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/braindog-web-${TAG#v}.tar.gz" -C apps/web build

      - name: write the notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The previous tag OF THE SAME KIND. `--match 'v2*'` keeps a package release from becoming
          # the boundary of an app release's notes; `|| true` covers the first release, which has no
          # previous tag and is not an error.
          previous="$(git describe --tags --abbrev=0 --match 'v2*' "${TAG}^" 2>/dev/null || true)"
          {
            printf 'app %s+%s\n\n' "${TAG#v}" "$(git rev-parse --short=7 HEAD)"
            if [ -n "$previous" ]; then
              printf '## Changes since %s\n\n' "$previous"
              git log --no-merges --format='- %s' "${previous}..${TAG}"
              printf '\n**Full changelog**: %s/compare/%s...%s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$previous" "$TAG"
            else
              # THE FIRST RELEASE DOES NOT ENUMERATE ITS OWN HISTORY. With no previous tag the
              # line this replaces printed every commit ever made - 310 of them at the first
              # tag - and a release note nobody scrolls to the end of tells a reader less than
              # four sentences do. What a first release owes somebody is what the thing is and
              # how far along it is, and both of those already have a home.
              printf '## The first release\n\n'
              printf 'The commit log is the changelog from here; this tag is where the count starts.\n\n'
              printf 'For what works today and what does not, read [REPORT.md](%s/blob/%s/REPORT.md).\n' \
                "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$TAG"
              printf '\n%s commits precede this tag.\n' "$(git rev-list --count "$TAG")"
            fi
            printf '\n---\n\n'
            printf 'The asset is the built browser client, static, unpacking to `build/`. Serve it from any\n'
            printf 'web server, or from the self-host. There is nothing to install and no account to make.\n'
          } > notes.md
          cat notes.md

      - name: create the release
        env:
          # `github.token`, not a secret: the built-in token, scoped by the `permissions` block
          # above to writing releases in this repository and nothing else.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `--verify-tag` refuses when the tag is not on the remote, which is the shape of the
          # accident where a workflow is re-run against a tag that has since been deleted.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            dist/*.tar.gz

  packages:
    needs: verify
    if: startsWith(github.ref_name, 'render-v') || startsWith(github.ref_name, 'cli-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # NO NPM TOKEN ANYWHERE, which is 52 §8's rule and 31 §6's decision. npm's trusted publishing
      # exchanges this short-lived OIDC identity for the right to publish these two names from this
      # repository and this workflow file; provenance is then automatic and needs no flag. A classic
      # token would be a long-lived secret whose blast radius is the package name for ever.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      # FIVE PRECONDITIONS, EACH REFUSING WITH THE FACT IT CHECKED. This job is inert today —
      # `packages/render` has no build script and its `exports` point at TypeScript source, and
      # `apps/cli` does not exist — and the useful behaviour for an inert job is to say precisely
      # which precondition is missing rather than to publish something broken or to be commented out
      # and forgotten.
      - name: preflight
        id: preflight
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            render-v*) dir=packages/render; semver="${TAG#render-v}" ;;
            cli-v*)    dir=apps/cli;        semver="${TAG#cli-v}" ;;
            *)         echo "  $TAG is neither a render nor a cli tag."; exit 1 ;;
          esac

          [ -d "$dir" ] || { echo "  $TAG names $dir, and this tree has no such directory."; exit 1; }

          manifest="$dir/package.json"
          name="$(node -p "require('./$manifest').name")"
          version="$(node -p "require('./$manifest').version")"

          # THE TAG AND THE MANIFEST HAVE TO AGREE (52 §2, release step 4). They disagree when a
          # release is tagged before the version commit, and the registry then holds a version no
          # tag points at.
          [ "$version" = "$semver" ] || { echo "  $TAG says $semver; $manifest says $version."; exit 1; }

          # `private: true` is npm's own refusal, and hitting it after a build is a worse place to
          # find out than here.
          node -e "if (require('./$manifest').private) { console.error('  $name is private and cannot be published.'); process.exit(1) }"

          # AND THE PACKAGE HAS TO SHIP SOMETHING A CONSUMER CAN RUN. `exports` pointing at `.ts` is
          # this workspace talking to itself through type-stripping; on a registry it is a package
          # that fails to import for everyone who is not this repository.
          node -e "
            const e = JSON.stringify(require('./$manifest').exports ?? {});
            if (e.includes('.ts')) {
              console.error('  $name exports TypeScript source. A published package resolves to built ESM (31 §8).');
              process.exit(1);
            }"

          node -e "if (!(require('./$manifest').scripts ?? {}).build) { console.error('  $name has no build script, and a publish must build what it ships.'); process.exit(1) }"

          {
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - run: pnpm --filter ${{ steps.preflight.outputs.name }} run build

      # `npm publish` AND NOT `pnpm publish`: the OIDC exchange that makes trusted publishing work
      # is npm's, and pnpm does not perform it. Run from the package directory, which is what npm
      # treats as the publish root.
      - run: npm publish
        working-directory: ${{ steps.preflight.outputs.dir }}

      # THE REGISTRY IS ASKED, RATHER THAN THE EXIT CODE TRUSTED (52 §2, release step 8) — the same
      # principle every gate in this repository is built on: check the thing itself.
      - run: |
          set -euo pipefail
          found="$(npm view "${NAME}@${VERSION}" version)"
          [ "$found" = "$VERSION" ] || { echo "  the registry shows $found for $NAME, not $VERSION."; exit 1; }
        env:
          NAME: ${{ steps.preflight.outputs.name }}
          VERSION: ${{ steps.preflight.outputs.version }}
