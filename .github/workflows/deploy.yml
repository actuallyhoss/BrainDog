# Production deploy to Cloudflare: build, record what is live, deploy the app and the site, check parity,
# smoke-test, and roll back on a red. Runs by hand from master only, behind the production environment.

name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/master'
      && github.repository == 'actuallyhoss/BrainDog'
      && vars.CLOUDFLARE_ACCOUNT_ID != ''
      && vars.DEPLOY_HOST != ''
    environment:
      name: production
      url: https://app.brain.dog

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: The build id this deploy is
        run: echo "BRAINDOG_BUILD=$(date -u +%Y.%m.%d)+$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Build the shell
        run: pnpm --filter ./apps/web build

      - name: Build the CLI for the site
        run: |
          pnpm --filter braindog-cli build
          node tools/ship/cli-sign.mjs
          mkdir -p apps/site/static/cli
          cp apps/cli/dist/braindog.mjs apps/cli/dist/braindog.mjs.sha256 apps/cli/dist/braindog.mjs.build apps/cli/dist/braindog.mjs.sig apps/site/static/cli/

      - name: Record what is live
        continue-on-error: true
        run: |
          (cd apps/worker && pnpm exec wrangler deployments status --json --env production) > "$RUNNER_TEMP/app-live.json" || true
          (cd apps/site && pnpm exec wrangler deployments status --json --env production) > "$RUNNER_TEMP/site-live.json" || true
          node apps/worker/scripts/rollback.mjs record "$RUNNER_TEMP/app-live.json" "$RUNNER_TEMP/site-live.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}

      - name: Keep what was live for the lane
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/live-before"
          printf 'APP_PREVIOUS=%s\nSITE_PREVIOUS=%s\nLIVE_SHA=%s\n' "$APP_PREVIOUS" "$SITE_PREVIOUS" "$LIVE_SHA" > "$RUNNER_TEMP/live-before/live-before.env"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        continue-on-error: true
        with:
          name: live-before
          path: ${{ runner.temp }}/live-before/live-before.env
          retention-days: 7

      - name: Take a restore point
        run: |
          cat > "$RUNNER_TEMP/restore-point.mjs" <<'JS'
          const [mode, title, when] = process.argv.slice(2);
          const key = process.env.PROVISION_KEY ?? '';
          const commit = (process.env.HEAD_SHA ?? '').toLowerCase();
          const needed = process.env.RESTORE_POINT_NEEDED === 'yes';
          const known = (process.env.RECORDS_KNOWN ?? '').trim() !== '';
          const notRun = (why) => {
            if (needed) {
              console.error(`::error::${title}: ${why} A migration changed in this deploy, so this is red and not a skip.`);
              process.exit(1);
            }
            console.log(`${title}: not run: ${why}`);
            process.exit(0);
          };
          if (key === '') notRun("no key. Set PROVISION_KEY in the production environment's secrets.");
          let cursor;
          let asked = 0;
          for (let page = 0; page < 500; page++) {
            let status = 0;
            let out = null;
            try {
              const res = await fetch(`https://${process.env.DEPLOY_HOST}/account/ops/restore-point`, {
                method: 'POST',
                headers: { authorization: `Bearer ${key}`, 'content-type': 'application/json' },
                body: JSON.stringify({ check: mode === 'check', ...(/^[0-9a-f]{7,40}$/.test(commit) ? { commit } : {}), ...(cursor ? { cursor } : {}), ...(known ? { open: true } : {}) }),
                signal: AbortSignal.timeout(120_000),
              });
              status = res.status;
              out = await res.json().catch(() => null);
            } catch (e) {
              console.error(`${title}: the host did not answer: ${e instanceof Error ? e.message : String(e)}`);
              process.exit(1);
            }
            if (status === 404) {
              const why = 'the live build has no restore-point door, or no operator key of its own.';
              if (when === 'after' || !needed) notRun(why);
              console.log(`::warning::${title}: not run: ${why} A migration changed in this deploy and no copy was taken before it. This is not red, because the deploy that first ships the door must be able to run.`);
              process.exit(0);
            }
            const said = out?.value?.said ?? out?.refusal?.fix ?? 'no answer';
            console.log(`${title}: ${said}`);
            if (status !== 200) process.exit(1);
            asked += Number(out?.value?.asked) || 0;
            cursor = out?.value?.cursor;
            if (cursor) continue;
            if (asked > 0) process.exit(0);
            if (known) {
              console.error(`::error::${title}: no open record was listed, so nothing was opened, and this host holds the canary. The list of records is wrong.`);
              process.exit(1);
            }
            console.log(`::warning::${title}: not checked: no open record was listed, and no canary is named to say there is one.`);
            process.exit(0);
          }
          console.error(`${title}: the walk did not end after 500 pages.`);
          process.exit(1);
          JS
          needed=unknown
          if [ -n "$LIVE_SHA" ] && git cat-file -e "$LIVE_SHA^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$LIVE_SHA" HEAD -- 'packages/kernel/src/migrations/*.ts')
            if [ -z "$changed" ]; then needed=no; else needed=yes; fi
          fi
          export RESTORE_POINT_NEEDED="$needed"
          echo "RESTORE_POINT_NEEDED=$needed" >> "$GITHUB_ENV"
          if [ -z "$PROVISION_KEY" ]; then
            if [ "$needed" = yes ]; then
              echo "::error::Take a restore point: a migration changed since $LIVE_SHA and there is no key, so no copy can be taken before it ships. Set PROVISION_KEY in the production environment's secrets."
              exit 1
            fi
            echo "Take a restore point: not run: no key. Set PROVISION_KEY in the production environment's secrets."
            exit 0
          fi
          if ! RESTORE_POINT_NEEDED=no node "$RUNNER_TEMP/restore-point.mjs" check "Take a restore point (check)"; then
            echo "::warning::The live build could not open every record in use. The deploy goes on, since it may be the fix."
          fi
          if [ "$needed" = no ]; then
            echo "Take a restore point: no migration changed since $LIVE_SHA, so nothing is copied."
            exit 0
          fi
          node "$RUNNER_TEMP/restore-point.mjs" take "Take a restore point"
        env:
          PROVISION_KEY: ${{ secrets.PROVISION_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          HEAD_SHA: ${{ github.sha }}
          RECORDS_KNOWN: ${{ vars.SMOKE_SLUG }}

      - name: Deploy
        run: pnpm --filter ./apps/worker exec wrangler deploy --env production --var BRAINDOG_BUILD:"$BRAINDOG_BUILD"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Parity
        id: parity
        run: pnpm gates -- --only deploy-parity
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}

      - name: Build the marketing site
        run: pnpm --filter ./apps/site build

      - name: Deploy the marketing site
        run: pnpm --filter ./apps/site exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke
        id: smoke
        run: node apps/worker/scripts/smoke.mjs production
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          SMOKE_SLUG: ${{ vars.SMOKE_SLUG }}

      - name: Sandbox smoke
        run: |
          node --input-type=module <<'JS'
          import { pathToFileURL } from 'node:url';
          const { wranglerConfig } = await import(pathToFileURL('apps/worker/scripts/provision-check.mjs').href);
          const record = String(wranglerConfig().env?.production?.vars?.OPS_RECORD ?? '').trim();
          if (record === '') {
            console.log('The sandbox smoke is skipped: OPS_RECORD is empty in apps/worker/wrangler.jsonc, so there is no canary record to run a script on.');
            process.exit(0);
          }
          const fail = (why) => {
            console.error(`The sandbox smoke failed on ${record}: ${why}`);
            process.exit(1);
          };
          const token = process.env.SMOKE_TOKEN ?? '';
          if (!token.startsWith(`${record}.`)) fail('SMOKE_TOKEN is not a token on this record, so the sandbox cannot be asked. Mint one there at propose or above and set it again.');
          const said = 'The sandbox ran this deploy smoke.';
          const body = { script: 'deploy_smoke', runs: { rule: true }, egress: [], keys: [], reads: [], writes: [], source: `export default (ctx) => { ctx.log(${JSON.stringify(said)}); };` };
          let status = 0;
          let text = '';
          try {
            const answer = await fetch(`https://${process.env.DEPLOY_HOST}/api/scriptTry`, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
              body: JSON.stringify({ body }),
              signal: AbortSignal.timeout(30_000),
            });
            status = answer.status;
            text = await answer.text();
          } catch (e) {
            fail(`the host did not answer: ${e instanceof Error ? e.message : String(e)}`);
          }
          if (/no sandbox/i.test(text)) fail('the fixture was metered "no sandbox", so this deploy has no LOADER binding and no script anywhere will run.');
          if (status !== 200 || !text.includes(said)) fail(`it answered ${status} without the fixture's log: ${text.slice(0, 400)}`);
          const cpu = /"cpu_ms":\s*(\d+)/.exec(text)?.[1];
          console.log(`The sandbox ran a script on ${record} and answered its log. The loader reported ${cpu === undefined || cpu === '0' ? 'no CPU time' : `${cpu} ms of CPU time`}.`);
          JS
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}

      - name: Check the records open
        run: node "$RUNNER_TEMP/restore-point.mjs" check "Check the records open" after
        env:
          PROVISION_KEY: ${{ secrets.PROVISION_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          HEAD_SHA: ${{ github.sha }}
          RECORDS_KNOWN: ${{ vars.SMOKE_SLUG }}

      - name: Decide whether to roll back
        id: rollback
        if: failure() && (steps.parity.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: node apps/worker/scripts/rollback.mjs decide
        env:
          HEAD_SHA: ${{ github.sha }}
          FAILED_AT: ${{ steps.smoke.outcome == 'failure' && 'smoke' || 'parity' }}

      - name: Roll the app back
        if: failure() && steps.rollback.outputs.app != ''
        run: |
          echo "Rolling the app back to $VERSION"
          cd apps/worker && pnpm exec wrangler rollback "$VERSION" --env production --message "Rolled back by deploy.yml after a red Parity or Smoke" --yes
        env:
          VERSION: ${{ steps.rollback.outputs.app }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Roll the site back
        if: failure() && steps.rollback.outputs.site != ''
        run: |
          echo "Rolling the site back to $VERSION"
          cd apps/site && pnpm exec wrangler rollback "$VERSION" --env production --message "Rolled back by deploy.yml after a red Smoke" --yes
        env:
          VERSION: ${{ steps.rollback.outputs.site }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build the alpha shell
        if: vars.DEPLOY_ALPHA == 'true'
        continue-on-error: true
        run: pnpm --filter ./apps/web build
        env:
          BRAINDOG_ENV: alpha

      - name: Deploy alpha
        if: vars.DEPLOY_ALPHA == 'true'
        continue-on-error: true
        run: pnpm --filter ./apps/worker exec wrangler deploy --env alpha --var BRAINDOG_BUILD:"$BRAINDOG_BUILD"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build the alpha marketing site
        if: vars.DEPLOY_ALPHA == 'true'
        continue-on-error: true
        run: pnpm --filter ./apps/site build
        env:
          BRAINDOG_ENV: alpha

      - name: Deploy the alpha marketing site
        if: vars.DEPLOY_ALPHA == 'true'
        continue-on-error: true
        run: pnpm --filter ./apps/site exec wrangler deploy --env alpha
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke alpha
        if: vars.DEPLOY_ALPHA == 'true'
        continue-on-error: true
        run: node apps/worker/scripts/smoke.mjs alpha
