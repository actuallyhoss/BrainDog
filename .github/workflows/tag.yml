# Verifies a tagged tree, and publishes braindog-render and the CLI to npm through trusted publishing.
# The tag is the version; there are no GitHub Releases.

name: tag

on:
  push:
    tags: ['v*', 'render-v*', 'cli-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm gates -- --except bundle,keys,prefs,layout,a11y,passkey,queue,row-drawer,perf,self-test,deploy-parity

  app:
    needs: verify
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: the build tuple
        env:
          TAG: ${{ github.ref_name }}
        run: echo "BRAINDOG_BUILD=${TAG#v}+$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - run: pnpm --filter @braindog/web build

      - run: git diff --exit-code

  packages:
    needs: verify
    if: startsWith(github.ref_name, 'render-v') || startsWith(github.ref_name, 'cli-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: preflight
        id: preflight
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            render-v*) dir=packages/render; semver="${TAG#render-v}"; npm=braindog-render ;;
            cli-v*)    dir=apps/cli;        semver="${TAG#cli-v}";    npm=braindog ;;
            *)         echo "  $TAG is neither a render nor a cli tag."; exit 1 ;;
          esac

          [ -d "$dir" ] || { echo "  $TAG names $dir, and this tree has no such directory."; exit 1; }

          manifest="$dir/package.json"
          name="$(node -p "require('./$manifest').name")"
          version="$(node -p "require('./$manifest').version")"

          [ "$version" = "$semver" ] || { echo "  $TAG says $semver; $manifest says $version."; exit 1; }

          node -e "if (require('./$manifest').private) { console.error('  $name is private and cannot be published.'); process.exit(1) }"

          node -e "
            const m = require('./$manifest');
            const e = JSON.stringify([m.publishConfig?.exports ?? m.exports ?? {}, m.bin ?? {}]);
            if (/(?<!\.d)\.ts\"/.test(e)) {
              console.error('  $name ships TypeScript source. A published package resolves to built ESM (31 §8).');
              process.exit(1);
            }"

          node -e "if (!(require('./$manifest').scripts ?? {}).build) { console.error('  $name has no build script, and a publish must build what it ships.'); process.exit(1) }"

          node -e "
            const [a, b, c] = process.argv[1].split('.').map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error('  npm is ' + process.argv[1] + ', and trusted publishing needs 11.5.1 or later.');
              process.exit(1);
            }" "$(npm --version)"

          {
            echo "dir=$dir"
            echo "name=$name"
            echo "npm=$npm"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - env:
          NAME: ${{ steps.preflight.outputs.name }}
        run: pnpm --filter "$NAME" run build

      - name: the files the manifest names
        working-directory: ${{ steps.preflight.outputs.dir }}
        run: |
          node -e "
            const fs = require('node:fs');
            const m = require('./package.json');
            const named = [];
            const walk = (v) => (typeof v === 'string' ? named.push(v) : Object.values(v ?? {}).forEach(walk));
            walk(m.publishConfig?.exports ?? m.exports);
            walk(typeof m.bin === 'string' ? [m.bin] : m.bin);
            const missing = named.filter((p) => !fs.existsSync(p));
            if (missing.length > 0) {
              console.error('  The build did not make ' + missing.join(', ') + ', which the manifest names.');
              process.exit(1);
            }"

      - name: the published manifest
        working-directory: ${{ steps.preflight.outputs.dir }}
        env:
          NPM_NAME: ${{ steps.preflight.outputs.npm }}
        run: |
          node -e "
            const fs = require('node:fs');
            const m = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            m.name = process.env.NPM_NAME;
            if (m.publishConfig?.exports) {
              m.exports = m.publishConfig.exports;
              delete m.publishConfig.exports;
            }
            delete m.devDependencies;
            fs.writeFileSync('package.json', JSON.stringify(m, null, 2) + String.fromCharCode(10));"

      - run: npm publish
        working-directory: ${{ steps.preflight.outputs.dir }}

      - run: |
          set -euo pipefail
          found="$(npm view "${NAME}@${VERSION}" version)"
          [ "$found" = "$VERSION" ] || { echo "  the registry shows $found for $NAME, not $VERSION."; exit 1; }
        env:
          NAME: ${{ steps.preflight.outputs.npm }}
          VERSION: ${{ steps.preflight.outputs.version }}
