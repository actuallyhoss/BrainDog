# Runs the provision command's bash form on macOS, where bash is 3.2 and curl is Apple's.

name: macos

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  provision-ask:
    name: provision command on macOS
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0

      - name: Put Apple's bash first
        run: |
          mkdir -p "$RUNNER_TEMP/apple-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/apple-bash/bash"
          echo "$RUNNER_TEMP/apple-bash" >> "$GITHUB_PATH"

      - name: Say which shell and curl
        run: |
          sw_vers
          command -v bash
          bash --version | head -n 1
          curl --version | head -n 1

      - name: Run the bash form with a quoted, accented name
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/provision-ask.tap" \
            apps/worker/scripts/provision-ask.test.mjs
          grep -qx '# fail 0' "$RUNNER_TEMP/provision-ask.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/provision-ask.tap" || { echo 'The bash form was skipped, so nothing ran on this Mac.'; exit 1; }
