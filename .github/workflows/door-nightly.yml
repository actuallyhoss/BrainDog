# Drives a real Claude Code client through the MCP door of a live host and checks what it sees.
# Runs by hand; needs repository secrets.

name: door-nightly

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'The host to check. Empty is production.'
        required: false
        default: ''
        type: string
      record:
        description: 'The record to check, by its address or slug. Empty is DOOR_RECORD.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: door-nightly
  cancel-in-progress: false

jobs:
  door:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
      - name: The runner's own tests
        run: node --test tools/door-check/test/run.test.mjs
      - name: Real agent apps through the door
        env:
          DOOR_HOST: ${{ inputs.host || 'https://app.brain.dog' }}
          DOOR_RECORD: ${{ inputs.record || vars.DOOR_RECORD }}
          DOOR_TOKEN: ${{ !inputs.host && !contains(inputs.record, '://') && secrets.DOOR_TOKEN || '' }}
          DOOR_TOKEN_2: ${{ !inputs.host && !contains(inputs.record, '://') && secrets.DOOR_TOKEN_2 || '' }}
          ANTHROPIC_API_KEY: ${{ !inputs.host && !contains(inputs.record, '://') && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ !inputs.host && !contains(inputs.record, '://') && secrets.OPENAI_API_KEY || '' }}
          CURSOR_API_KEY: ${{ !inputs.host && !contains(inputs.record, '://') && secrets.CURSOR_API_KEY || '' }}
        run: node tools/door-check/run.mjs --report report.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: door-report
          path: report.json
          if-no-files-found: warn
          retention-days: 30
