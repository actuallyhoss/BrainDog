# Builds the self-host container image, and pushes it to ghcr.io only when IMAGE_PUSH is 'true'.

name: image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Name the image
        id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-selfhost"
          stamp="$(date -u +%Y-%m-%d)-${GITHUB_SHA::8}"
          tags="${repo}:${stamp}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tags="${tags},${repo}:latest"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Sign in to ghcr.io
        if: ${{ vars.IMAGE_PUSH == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and push when IMAGE_PUSH is 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/selfhost/Dockerfile
          push: ${{ vars.IMAGE_PUSH == 'true' }}
          load: ${{ vars.IMAGE_PUSH != 'true' }}
          tags: ${{ steps.name.outputs.tags }}

      - name: Say whether it starts healthy
        if: ${{ vars.IMAGE_PUSH != 'true' }}
        env:
          TAGS: ${{ steps.name.outputs.tags }}
        run: |
          image="$(echo "$TAGS" | cut -d, -f1)"
          docker run --rm -v "$RUNNER_TEMP/data:/data" -u 0 "$image" sh -c 'chown node:node /data'
          docker run --rm -v "$RUNNER_TEMP/data:/data" "$image" node apps/selfhost/src/main.ts init image-check --owner owner@example.com
          id="$(docker run -d -v "$RUNNER_TEMP/data:/data" "$image")"
          for _ in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$id")"
            [[ "$state" == healthy ]] && break
            sleep 5
          done
          echo "the container is ${state}"
          docker rm -f "$id" >/dev/null
          [[ "$state" == healthy ]]
