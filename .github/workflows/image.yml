name: image

# THE SELF-HOST IMAGE, BUILT BY HAND OR ON AN APP TAG, AND PUSHED ONLY WHEN THE OWNER SAYS SO.
#
# `apps/selfhost/Dockerfile` over the whole workspace. It is built on every run, so a tag whose image does not build is
# known on the day it is cut. It goes to ghcr.io only when the repository variable IMAGE_PUSH is 'true', which is his
# call (H7): an image on a public registry is a release somebody may pull and run, and nothing in CI decides that.
#
# THE TAG IS `<date>-<sha>` (docs/53 section 3), and `latest` beside it when pushed from a tag, because the app has no
# semver and a date and a commit are what a self-hoster reads to know what they run.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Only used when IMAGE_PUSH is 'true'; the login step below does not run otherwise.
  packages: write

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  image:
    # A HOSTED LINUX RUNNER, because the image is a Linux image and the self-hosted runner is Windows. It runs only by
    # hand and on an app tag, so it costs a few minutes a release.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-selfhost"
          stamp="$(date -u +%Y-%m-%d)-${GITHUB_SHA::8}"
          tags="${repo}:${stamp}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tags="${tags},${repo}:latest"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        if: ${{ vars.IMAGE_PUSH == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and push when IMAGE_PUSH is 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/selfhost/Dockerfile
          push: ${{ vars.IMAGE_PUSH == 'true' }}
          load: ${{ vars.IMAGE_PUSH != 'true' }}
          tags: ${{ steps.name.outputs.tags }}

      # THE IMAGE IS HEALTHY WITH NOTHING GIVEN TO IT, which is the loopback-only container a tokenless run makes. Only
      # when it was loaded here, since a pushed image is not in this runner's store.
      - name: Say whether it starts healthy
        if: ${{ vars.IMAGE_PUSH != 'true' }}
        run: |
          image="$(echo '${{ steps.name.outputs.tags }}' | cut -d, -f1)"
          docker run --rm -v "$RUNNER_TEMP/data:/data" -u 0 "$image" sh -c 'chown node:node /data'
          docker run --rm -v "$RUNNER_TEMP/data:/data" "$image" node apps/selfhost/src/main.ts init image-check --owner owner@example.com
          id="$(docker run -d -v "$RUNNER_TEMP/data:/data" "$image")"
          for _ in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' "$id")"
            [[ "$state" == healthy ]] && break
            sleep 5
          done
          echo "the container is ${state}"
          docker rm -f "$id" >/dev/null
          [[ "$state" == healthy ]]
