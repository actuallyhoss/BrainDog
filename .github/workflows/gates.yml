# Every gate, including the browser gates (layout, a11y) that are too slow for every push.
# Runs by hand; shards the browser gates over three jobs.

name: gates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gates-build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-gates')
    name: gates build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - run: pnpm --filter @braindog/web build
      - run: pnpm --filter @braindog/site build

      - run: git diff --exit-code

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: builds
          overwrite: true
          path: |
            apps/web/build
            apps/web/.svelte-kit/output/client
            apps/site/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  gates-shard:
    needs: gates-build
    name: gates ${{ matrix.part }} of ${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - id: browser
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - if: runner.environment == 'github-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-webkit-${{ runner.os }}-${{ steps.browser.outputs.version }}

      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: builds
          path: apps

      - run: find apps/web/build apps/web/.svelte-kit/output/client apps/site/build -exec touch {} +

      - if: github.event_name == 'push'
        run: pnpm gates -- --only layout,a11y --shard ${{ matrix.part }}/${{ strategy.job-total }}

      - if: github.event_name != 'push'
        run: pnpm gates -- --allow-skip deploy-parity,rule-sheet --shard ${{ matrix.part }}/${{ strategy.job-total }}

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-log-${{ matrix.part }}
          overwrite: true
          path: .a11y.log
          if-no-files-found: ignore

  gates:
    needs: [gates-build, gates-shard]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-gates')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          BUILD: ${{ needs.gates-build.result }}
          PARTS: ${{ needs.gates-shard.result }}
        run: |
          echo "the build: $BUILD. every part: $PARTS."
          test "$BUILD" = success && test "$PARTS" = success
