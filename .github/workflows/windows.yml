# The kernel, self-host and CLI tests on Windows. Called by ci.yml on pull requests labelled full-gates.

name: windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Test the kernel
        run: pnpm --dir packages/kernel run test
      - name: Test the self-host
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/selfhost run test
      - name: Test the CLI
        if: ${{ !cancelled() }}
        run: pnpm --dir apps/cli run test
