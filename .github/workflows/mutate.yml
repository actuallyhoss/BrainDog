# Mutation checks: breaks each guard tools/mutate.mjs names and expects its tests to go red.

name: mutate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  mutate:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-gates')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: node tools/mutate.mjs
