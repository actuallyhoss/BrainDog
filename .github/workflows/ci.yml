name: ci

# 52 §2's `ci.yml`, less most of the browser. `test` typechecks and tests the whole tree in four
# legs, `gates` runs every gate that needs nothing built (`--unbuilt`), and `build` builds the app
# and the site, tests the site against its build, dry-runs both production deploys, runs every gate
# that reads a web build (`--built`) and the gate runner's own tests. `layout` and `a11y` are
# `gates.yml`'s until PRF-B10, and the reason for the split is at the top of that file and beside
# the `--except` below. The runner chooses the gates from what each declares it needs, so no line
# here names one it runs. `windows`, on a pull request labelled `full-gates` only, runs
# the kernel, self-host and CLI tests on Windows through `windows.yml`, which also runs them weekly.
#
# FOUR LEGS AND A GATES JOB, BECAUSE ONE JOB COULD NO LONGER HOLD A WORKFLOW'S WORTH OF TESTS. The
# single `check` job that did all of this took 19 min 13 s in run 35931879146 on 24 September, the
# next run was killed at its 20-minute ceiling in the middle of the gates with nothing hung, and
# the last run before this split took 23 min 44 s against a ceiling of 30. A large change can land
# three areas' worth of new tests at once, so that ceiling
# would have been reached by the tree growing rather than by anything hanging. Split, each leg has
# a ceiling of its own, and a red leg names the part of the tree it covers.
#
# ON ONE SELF-HOSTED RUNNER THE LEGS QUEUE rather than run side by side, and the split still holds
# there: the ceiling is per leg, so a slow leg is no longer a timeout for the whole suite.
#
# WHAT THIS COSTS IS THE POINT OF IT. The source gates are greps; the two browser gates alone are
# 627 page-runs and 212 audits, about nineteen minutes. A single workflow carrying both is one that
# gets cancelled, ignored, or made `continue-on-error` within a month, and a check nobody waits for
# is a check that is not run.
#
# ACTIONS ARE PINNED TO A MAJOR, which is 52 §8's rule and not the strongest one available. A major
# tag is mutable: `actions/checkout@v4` is whatever the tag points at this morning, so a compromised
# publisher reaches this repository without a commit here. A 40-character SHA closes that and costs
# an update mechanism, because a pinned digest is a digest nobody bumps. The mechanism is
# `.github/renovate.json5`, which has `pinDigests: true` for the `github-actions` manager: turn
# Renovate on and the four tags below become digests with the tag beside them in a comment, kept
# current by a pull request rather than by somebody remembering. Until then a major tag from
# `actions/*` and `pnpm/*` is the exposure this repository has accepted, and it is written down here
# rather than left as an omission.

on:
  push:
    branches: [master]
  # 52 §2 says `on: push, pull_request` with no branch filter. A bare `push:` beside
  # `pull_request:` runs this twice for every commit on a branch that has a pull request open
  # (same commit, same result, twice the minutes), so `push` is master alone and the branch's runs
  # come from the pull request.
  pull_request:

permissions:
  contents: read

concurrency:
  # A superseded run is measuring a tree nobody will merge. Keyed on the pull request where there is
  # one, so two open branches do not cancel each other; `github.ref` alone would be `refs/pull/N/merge`
  # here and would work, but reads as though it were about the branch, which it is not.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# BASH ON EVERY RUNNER. A Windows self-hosted runner runs a step without a named shell in PowerShell,
# where $BRAINDOG_BUILD is an empty PowerShell variable, and the first deploy from one shipped a
# Worker that did not know its build.
defaults:
  run:
    shell: bash

jobs:
  test:
    # FOUR LEGS OVER THE WORKSPACES, AND EVERY WORKSPACE IN EXACTLY ONE OF THEM.
    # `apps/worker/scripts/ci-workflow.test.mjs` reads the legs below against `pnpm-workspace.yaml`
    # and is red when a workspace sits in no leg or in two, or a leg names a folder that holds no
    # workspace, so a package added tomorrow cannot go untested here without a run saying so. That
    # test runs in the `apps` leg, which is how the check reaches every push.
    #
    # THE ROOT `pnpm test` IS UNCHANGED IN SHAPE. It still runs every workspace and then the docs'
    # tests in one command, so a full run at a desk is the union of these four legs and nothing else.
    # What reads a build (the site's built pages, the gate runner's own tests) is the build job's.
    name: test ${{ matrix.leg }}
    # PINNED, NOT `ubuntu-latest`. GitHub rolls that label to a new image about once a year and the
    # rollout is silent; the same commit then compiles against a different libc, a different browser
    # build and a different font set. `gates.yml` is where that actually changes a measurement, and
    # the two workflows agree on the runner so a red gate there can be reproduced from a green run
    # here.
    # SELF-HOSTED, BECAUSE THE ACCOUNT RAN OUT OF ACTIONS MINUTES (September 17th, the owner's call).
    # Self-hosted minutes are free. Set the repository variable CI_RUNNER to ubuntu-24.04 to go back.
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    # PER LEG, AND A CEILING FOR A HANG RATHER THAN A BUDGET. 52 §7 budgets the workflow at 20
    # minutes, and the split set 25 for each leg: a leg holds part of what the single job ran in
    # 19 min 13 s, so a leg has room to grow by a workflow of tests, and 25 is still far short of the
    # six hours the ceiling exists to stop.
    timeout-minutes: 25
    strategy:
      # A RED LEG DOES NOT CANCEL THE OTHER THREE. Each answers for a different part of the tree, and
      # a run that stops at the first red names one problem when there are four, which costs four
      # runs: the argument `run.mjs` makes for reporting every gate rather than stopping at one.
      fail-fast: false
      matrix:
        # `dirs` ARE FOLDERS, NOT PACKAGE NAMES, because the folder is what `pnpm-workspace.yaml`
        # lists and what a person adding a package creates. `packs/*/` is expanded by the shell in
        # the step below, so a new pack joins its leg with no line here; the trailing slash is what
        # keeps `packs/README.md` out of it, since a glob ending in `/` matches folders alone.
        include:
          # The kernel and what sits under it.
          - leg: kernel
            dirs: 'packages/ports packages/where packages/kernel packages/declare packages/extract packages/dog'
          # The record, its hosts and agents, and the packs, which are declarations over the record.
          - leg: record
            dirs: 'packages/record packages/host packages/mcp packages/client packages/slash packages/seed packages/script packages/connect packs/*/'
          # The app and what draws it. `apps/web/src/lib/record/figure-fit.test.ts` launches chromium.
          - leg: web
            dirs: 'apps/web packages/render packages/theme packages/skin'
            browser: true
          # The hosts, the CLI and the site, and the real MCP clients that greet the CLI's source
          # (`tools/client-checks`). The docs' tests ride here because `docs/` is not a
          # workspace, so no filter reaches them.
          - leg: apps
            dirs: 'apps/worker apps/selfhost apps/cli apps/site tools/client-checks'
            links: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # ONE `--filter` PER FOLDER, WRITTEN ONCE FOR THE STEPS BELOW. A folder that holds no workspace
      # is red here, by name, rather than left to a filter that selects nothing, where a leg could
      # pass having tested less than it names. No workspace folder has a space in its name, so the
      # list survives the shell's word split.
      - name: Choose this leg's workspaces
        env:
          DIRS: ${{ matrix.dirs }}
        run: |
          filters=''
          for dir in $DIRS; do
            dir="${dir%/}"
            if [ ! -f "$dir/package.json" ]; then echo "::error::$dir holds no package.json, so the ${{ matrix.leg }} leg would test nothing there"; exit 1; fi
            filters="$filters --filter ./$dir"
          done
          echo "The ${{ matrix.leg }} leg:$filters"
          echo "FILTERS=$filters" >> "$GITHUB_ENV"

      # FIRST, and for the reason `run.mjs` gives about its own first gate: a type error invalidates
      # every result under it. Over this leg's workspaces only, so the four legs together typecheck
      # what the root `pnpm typecheck` does. `gates` below runs the `typecheck` gate over the whole tree
      # once more, because `--unbuilt` is every gate that declares no need and `typecheck` declares none.
      - run: pnpm -r $FILTERS run typecheck

      # ONLY WHERE A TEST LAUNCHES CHROMIUM, and a hosted image has none cached (the first run on
      # ubuntu-latest, 22 September, failed four tests on a missing chrome-headless-shell). On
      # the self-hosted runner this found the browser already installed and cost a second. On a hosted image, a
      # leg that gains a browser test without this flag is red with Playwright's own sentence naming
      # the missing browser; on the self-hosted runner it passes on the browser already there.
      - if: matrix.browser
        run: pnpm exec playwright install --with-deps chromium

      # ONE WORKSPACE AT A TIME, as the root `pnpm test` runs them, so a leg is the same run a desk
      # makes of those folders.
      - run: pnpm -r --workspace-concurrency=1 $FILTERS run test
      # EVERY DOCS TEST BY ITS GLOB, so a new one needs no line here (PRF-B01).
      - if: matrix.links
        run: node --test docs/test/*.test.mjs

  gates:
    # A JOB OF ITS OWN, so the greps no longer wait for the whole suite, and a red gate and a red
    # test arrive as two named failures rather than one.
    # SELF-HOSTED, BECAUSE THE ACCOUNT RAN OUT OF ACTIONS MINUTES (September 17th, the owner's call).
    # Self-hosted minutes are free. Set the repository variable CI_RUNNER to ubuntu-24.04 to go back.
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    # No run of this job on its own has been measured yet. It is a leg's ceiling, for a hang.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # EVERY GATE THAT NEEDS NOTHING BUILT, CHOSEN BY THE RUNNER AND NOT BY A LIST HERE (PRF-B01).
      # `--unbuilt` is every gate whose `needs` (`tools/gates/run.mjs`, `NEEDS`) names no build and no
      # live host, and `--built` in the build job below is every gate a web build satisfies. The two are
      # read off the gates themselves, so a gate added tomorrow runs in one of them with no line here.
      # This step named ten gates to leave out until October, and every name was a place a gate could
      # go quietly unrun after its reason had gone. `ci-workflow.test.mjs` is red on any gate name in
      # a run line here but the two the build job still waits on.
      #
      # NOT BUILDING IS STILL DELIBERATE. A gate that turns out to need a build and has not said so
      # exits 3 here, which `run.mjs` makes red under CI: the failure is a sentence naming the gate,
      # and the fix is its `needs` line, which moves it to the build job. `deploy-parity` needs a live
      # host, which only `deploy.yml` has, so it is in neither selection.
      - run: node tools/gates/run.mjs --unbuilt

  build:
    # A JOB OF ITS OWN, because it answers a different question and can answer it at the same time.
    # `test` and `gates` ask whether the tree is correct; this asks whether it still produces a
    # product, and on a pull request without the `full-gates` label nothing else does.
    # `adapter-static` with `strict: true` fails here when a route quietly stops prerendering, which
    # is the defect that ships as a blank page rather than as an error.
    # SELF-HOSTED, BECAUSE THE ACCOUNT RAN OUT OF ACTIONS MINUTES (September 17th, the owner's call).
    # Self-hosted minutes are free. Set the repository variable CI_RUNNER to ubuntu-24.04 to go back.
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    # Four Vite builds for the app (the shipped record plus the cloud, quiet and busy variants), one
    # for the site, the site's tests, the gates that read them and the runner's tests. The job took
    # 2 min 39 s on the self-hosted runner on 21 September before the gates were added, and the first
    # three (`bundle`, `passkey`, `queue`) measured 6.4 s in `gates.yml` run 35587734418. `self-test`, `prefs` and `keys` add about 4.5 minutes (measured once), which is
    # why the ceiling moved from 15 to 20: a ceiling for a hang, not a budget. The two dry runs
    # have not been measured in this job yet, nor have the site's tests and the runner's tests, which
    # take about ten seconds together at a desk.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: pnpm --filter @braindog/web build
      # THE BUILT-SHELL HALF OF THE CSP TEST: it skips under plain `node --test` when
      # `apps/web/build` is absent, which is every `test` leg, so only a job that builds first can
      # run it on every push.
      - run: node --test apps/web/test/csp.test.ts
      # AND THE SELF-HOST SERVING THAT BUILD UNDER ITS APP PATH, which skips without `apps/web/build` in
      # every `test` leg for the same reason.
      - run: node --test apps/selfhost/test/app-path.test.ts
      - run: pnpm --filter @braindog/site build
      # THE SITE'S OWN TESTS, WITH THE BUILD THEY READ (LCH-B01, PRF-B01). The `apps` leg runs them
      # too, with no build, so the ones that read the served bytes skip there and say why: 37 skips
      # rode that green leg on every push, and nothing else ran them. Here they run right after the
      # build, and `SITE_BUILT=1` turns a missing page from a skip into a failure that names it
      # (`apps/site/test/built.ts`). A screenshot put back on the home page is red in this step.
      - name: Test the site against its build
        env:
          SITE_BUILT: '1'
        run: pnpm --filter @braindog/site test
      # THE CLI BUNDLE TOO, so a change esbuild cannot bundle is red on the push and not first at the deploy, which
      # builds it before anything goes live.
      - run: pnpm --filter braindog-cli build
      - run: node apps/cli/dist/braindog.mjs --version
      # A REAL CLIENT'S HANDSHAKE WITH THE COMMAND JUST BUNDLED (PRF-A06). The official MCP client SDKs, at the
      # versions agent apps ship (`tools/client-checks/clients.json`), greet `braindog mcp` over stdio and a self-host's
      # `/mcp` over HTTP at every revision the server claims: they list the tools, list the resources, ping and call
      # one. The tools did not list in a real client for a week while every hand-written test was green, and a red
      # step here holds the deploy. `BRAINDOG_CLI_BUILT=1` runs the bundle rather than the source, and makes a missing
      # bundle a failure; the `apps` leg runs the same file against the source.
      - name: Greet the agent door with real MCP clients
        env:
          BRAINDOG_CLI_BUILT: '1'
        run: node --test tools/client-checks/sdk.test.mjs

      # AND THE BUILD MUST NOT HAVE CHANGED A TRACKED FILE.
      #
      # Both builds begin with `pnpm --filter @braindog/skin theme`, which WRITES `tokens.css` and
      # the favicons. So a committed palette that no longer matches the generator is quietly
      # repaired here, and the `theme` gate, which is `theme.mjs --check`, then compares the
      # regenerated file against itself and passes. That is a gate measuring its own output: the
      # drift it exists to catch is invisible to it in exactly the workflow that is supposed to
      # catch it.
      #
      # One line closes it, and it closes the general case rather than the palette: after a build,
      # every tracked file is as committed, or the build generates something a person has not
      # reviewed.
      - run: git diff --exit-code

      # AND BOTH PRODUCTION DEPLOYS, DRY. `wrangler deploy --dry-run` bundles the Worker and reads
      # its `wrangler.jsonc` the way `deploy.yml` will, and uploads nothing. Without it the first
      # time `wrangler` itself reads the production block of either config is the deploy, and the
      # site deploys after the app has already gone live (`deploy.yml`), so a site config `wrangler`
      # refuses would be found with the app half shipped. After the diff check, because the dry run
      # reads the assets the builds above wrote; into `$RUNNER_TEMP`, so its bundle lands outside
      # the tree rather than among the files the diff check reads.
      #
      # NO CLOUDFLARE CREDENTIAL IN THE STEP. This workflow runs on every pull request, the runner
      # may be a PC with a token in its environment, and a dry run needs none. The `unset` makes
      # that true of the process as well as of this file, which names no secret at all.
      - name: Dry-run the app's production deploy
        run: |
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          pnpm --filter ./apps/worker exec wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/worker"
      - name: Dry-run the site's production deploy
        run: |
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          pnpm --filter ./apps/site exec wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/site"

      # THE BROWSER, WHICH IS ALREADY ON THE SELF-HOSTED RUNNER. `passkey` and `queue` launch chromium. The
      # install found it in %LOCALAPPDATA%\ms-playwright and took one second in the 21 September
      # `gates.yml` run; the step is here for the day CI_RUNNER points back at a hosted image, where
      # it is a download of about 150 MB and a minute or two with no cache.
      - run: pnpm exec playwright install --with-deps chromium

      # EVERY GATE A WEB BUILD SATISFIES, CHOSEN BY THE RUNNER (PRF-B01). `--built` reads each gate's
      # `needs` as `--unbuilt` does in `gates` above, so the two jobs together run every gate but
      # `deploy-parity`, and neither names one. A gate that declares `web-build` tomorrow runs here
      # from that push.
      #
      # `layout` AND `a11y` ARE THE ONE LIST LEFT, AND THE REASON IS THE CANCELLATION RATE. They are
      # about 14 of the 19 minutes `pnpm gates` took on this runner, and a `ci` run of 21 minutes or
      # more was cancelled by the next push more than half the time over five days. A cancelled `ci`
      # is a deploy that never starts. They stay in `gates.yml` until PRF-B10 makes a red screen check
      # stop the deploy, which removes this `--except`; `ci-workflow.test.mjs` names that unit.
      #
      # NO GATE HOLDS A FIXED PORT (`a9897f7a`), so a CI run and a desk run of the same gate on this
      # runner cannot collide. `run.mjs` runs a selection in registry order, so `self-test` runs
      # first.
      - run: node tools/gates/run.mjs --built --except layout,a11y

      # THE GATE RUNNER'S OWN TESTS, WHICH NO SCRIPT REACHED (PRF-B01). `tools` is no workspace, so no
      # leg's filter finds `tools/gates/test`, and the tests that hold the runner's promises (what a
      # gate needs, how a run is cut into shards) had never run on this runner. After the builds,
      # because some of them read what the build wrote. By glob, so a new one needs no line here.
      - run: node --test tools/gates/test/*.test.mjs
      # AND THE LOOK'S OWN TESTS, FOR THE SAME REASON: `tools/look` is no workspace either, so no leg
      # reaches `tools/look/test`, nor the tests beside its files. They build nothing and need no build; by glob, as above.
      - run: node --test tools/look/test/*.test.mjs tools/look/*.test.mjs
      # AND THE CANARY'S (PRF-A09): `tools/canary` is no workspace either.
      - run: node --test tools/canary/test/*.test.mjs
      # AND THE WATCH'S (LCH-C01): `tools/watch` is no workspace either, and its test is run by nothing else.
      - run: node --test tools/watch/*.test.mjs
      # AND THE DOOR CHECK'S RUNNER (`tools/door-check`), on every push and not only the nightly.
      - run: node --test tools/door-check/test/*.test.mjs

  windows:
    # THE KERNEL, THE SELF-HOST AND THE CLI ON WINDOWS, which is the owner's own machine and which
    # no other job here is sure to run on, since each follows `vars.CI_RUNNER`.
    # The steps are `windows.yml`'s, called
    # rather than copied, because that file also runs them weekly on a schedule of its own: a
    # schedule on this workflow would make every weekly run a production deploy through
    # `deploy.yml`, which is the reason it is not here.
    #
    # ON A PULL REQUEST THAT CARRIES `full-gates`, AND NOWHERE ELSE. A hosted Windows
    # minute is billed at twice a Linux one on a private repository, so it is not spent on every
    # push; on a push to master there is no pull request, and the job is skipped rather than red.
    # The label is read when a run starts, so one added to an open pull request takes effect from
    # its next push: `labeled` is not in this workflow's triggers, because there it would re-run
    # every job above on every label anybody adds.
    if: contains(github.event.pull_request.labels.*.name, 'full-gates')
    uses: ./.github/workflows/windows.yml
