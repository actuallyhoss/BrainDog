# Continuous integration: typecheck and tests in four legs, the source gates, and the builds with the
# gates that read them. Runs on every push and pull request to master and needs no secrets.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test ${{ matrix.leg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: kernel
            dirs: 'packages/ports packages/where packages/kernel packages/declare packages/extract packages/dog'
          - leg: record
            dirs: 'packages/record packages/host packages/mcp packages/client packages/slash packages/seed packages/script packages/connect packs/*/'
          - leg: web
            dirs: 'apps/web packages/render packages/theme packages/skin'
            browser: true
          - leg: apps
            dirs: 'apps/worker apps/selfhost apps/cli apps/site apps/watchdog apps/desktop tools/client-checks'
            links: true
            browser: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Choose this leg's workspaces
        env:
          DIRS: ${{ matrix.dirs }}
        run: |
          filters=''
          for dir in $DIRS; do
            dir="${dir%/}"
            if [ ! -f "$dir/package.json" ]; then echo "::error::$dir holds no package.json, so the ${{ matrix.leg }} leg would test nothing there"; exit 1; fi
            filters="$filters --filter ./$dir"
          done
          echo "The ${{ matrix.leg }} leg:$filters"
          echo "FILTERS=$filters" >> "$GITHUB_ENV"

      - run: pnpm -r $FILTERS run typecheck

      - if: matrix.browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm -r --workspace-concurrency=1 $FILTERS run test
      - if: matrix.links
        run: node --test docs/test/*.test.mjs

  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      # A pull request's commits are squashed on merge, so only the commits a push to master carries are read.
      - run: node tools/gates/run.mjs --unbuilt
        env:
          BRAINDOG_COMMITS_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{0}', github.sha) || format('{0}..{1}', github.event.before, github.sha) }}

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - run: pnpm --filter @braindog/web build
      - run: node --test apps/web/test/csp.test.ts
      - run: node --test apps/web/test/shell-copy.browser.test.mjs
      - run: node --test apps/selfhost/test/app-path.test.ts
      - run: pnpm --filter @braindog/site build
      - name: Test the site against its build
        env:
          SITE_BUILT: '1'
        run: pnpm --filter @braindog/site test
      - run: pnpm --filter braindog-cli build
      - run: node apps/cli/dist/braindog.mjs --version
      - name: Greet the agent door with real MCP clients
        env:
          BRAINDOG_CLI_BUILT: '1'
        run: node --test tools/client-checks/sdk.test.mjs

      - run: git diff --exit-code

      - name: Dry-run the app's production deploy
        run: |
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          pnpm --filter ./apps/worker exec wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/worker"
      - name: Dry-run the site's production deploy
        run: |
          unset CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          pnpm --filter ./apps/site exec wrangler deploy --dry-run --env production --outdir "$RUNNER_TEMP/site"

      - run: pnpm exec playwright install --with-deps chromium

      - run: node tools/gates/run.mjs --built --except layout,a11y

      - run: node --test tools/gates/test/*.test.mjs
      - run: node --test tools/look/test/*.test.mjs tools/look/*.test.mjs
      - run: node --test tools/canary/test/*.test.mjs
      - run: node --test tools/drill/*.test.mjs
      - run: node --test tools/ops/*.test.mjs
      - run: node --test tools/kept/*.test.mjs
      - run: node --test tools/watch/*.test.mjs
      - run: node --test tools/door-check/test/*.test.mjs
      - run: node --test tools/people/test/*.test.mjs
      - run: node --test tools/usecase-walks/*.test.mjs
      - run: node --test tools/catalogue/*.test.mjs tools/first-read-eval/*.test.mjs

  windows:
    if: contains(github.event.pull_request.labels.*.name, 'full-gates')
    uses: ./.github/workflows/windows.yml
