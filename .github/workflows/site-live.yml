# Opens every page of the live site at two widths, light and dark, and checks a few bounds on each.

name: site-live

on:
  workflow_dispatch:
    inputs:
      origin:
        description: 'The site to look at. Empty is production.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: site-live
  cancel-in-progress: false

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: The bounds reader's own test
        run: node --test apps/site/scripts/shots.test.mjs

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Look at the site
        env:
          SITE_ORIGIN: ${{ inputs.origin || 'https://brain.dog' }}
        working-directory: apps/site
        run: node scripts/shot.mjs --origin "$SITE_ORIGIN" --all --scale 1 --out "$RUNNER_TEMP/site-live"

      - name: Keep the sheet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-live-sheet
          path: ${{ runner.temp }}/site-live
          if-no-files-found: warn
          retention-days: 30
