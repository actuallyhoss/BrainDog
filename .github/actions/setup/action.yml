name: setup
description: Node, pnpm and a frozen install — the three steps every job in this repository starts with.

inputs:
  registry-url:
    description: >-
      Write an .npmrc for this registry. Set by tag.yml's publish job alone; every other job
      talks to no registry but the one the lockfile already resolved against.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24.13.0
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - run: pnpm install --frozen-lockfile
      shell: bash
