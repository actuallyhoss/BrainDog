<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300"
     role="img" aria-labelledby="wp-title wp-desc"
     font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#C1C1C1">
  <title id="wp-title">BrainDog: the write path</title>
  <desc id="wp-desc">A write whose op_id has been seen replays its first result and stops. Inside one
synchronous transaction: resolve, lock, pinned, coerce, validate and transition run first, and
nothing above that line has written a row; then persist, pairs, project, event, rules, schedule and
outbox. A refusal is recorded by observe, outside the transaction so it survives the rollback. Arm
and wake run last, outside it.</desc>

  <!-- The dark scheme, in the generated tokens from packages/skin/house.css:
       bg #0B0B0B, s1 #1C1C1C, line #404040, ink #F0F0F0, dim #C1C1C1, faint #969696,
       danger #E16C63, accent #CF413A. The accent paints chrome only, never
       text (13-UI section 2.1b). Nothing here loads over the network. -->

  <clipPath id="wp-panel"><rect width="830" height="300" rx="10"/></clipPath>
  <g clip-path="url(#wp-panel)">
    <rect width="830" height="300" fill="#0B0B0B"/>
    <rect width="830" height="3" fill="#CF413A"/>
  </g>
  <rect x=".5" y=".5" width="829" height="299" rx="9.5" fill="none" stroke="#404040"/>

  <text x="28" y="40" font-size="16" font-weight="600" fill="#F0F0F0">The write path</text>
  <text x="802" y="40" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#969696" text-anchor="end">docs/30-BLUEPRINT.md §4</text>

  <text x="28" y="72" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" fill="#F0F0F0"><tspan fill="#969696">0 </tspan>REPLAY</text>
  <text x="204" y="72">an op_id already seen returns its first result, and stops here</text>

  <rect x="28.5" y="92.5" width="773" height="121" rx="7" fill="#1C1C1C" stroke="#404040"/>
  <rect x="44" y="85" width="164" height="14" fill="#0B0B0B"/>
  <text x="50" y="96" font-size="11.5" fill="#969696">one synchronous transaction</text>

  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" fill="#F0F0F0">
    <text x="50.0" y="126"><tspan fill="#969696">1 </tspan>RESOLVE</text>
    <text x="182.5" y="126"><tspan fill="#969696">2 </tspan>LOCK</text>
    <text x="292.5" y="126"><tspan fill="#969696">2b </tspan>PINNED</text>
    <text x="425.0" y="126"><tspan fill="#969696">3 </tspan>COERCE</text>
    <text x="550.0" y="126"><tspan fill="#969696">4 </tspan>VALIDATE</text>
    <text x="690.0" y="126"><tspan fill="#969696">5 </tspan>TRANSITION</text>
  </g>

  <line x1="50" y1="154" x2="780" y2="154" stroke="#404040" stroke-dasharray="2 4"/>
  <rect x="278.9" y="145" width="272.2" height="18" fill="#1C1C1C"/>
  <text x="415.0" y="158" text-anchor="middle">nothing above this line has written a row</text>

  <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" fill="#F0F0F0">
    <text x="50.0" y="190"><tspan fill="#969696">6 </tspan>PERSIST</text>
    <text x="162.9" y="190"><tspan fill="#969696">6b </tspan>PAIRS</text>
    <text x="268.3" y="190"><tspan fill="#969696">7 </tspan>PROJECT</text>
    <text x="381.2" y="190"><tspan fill="#969696">8 </tspan>EVENT</text>
    <text x="479.2" y="190"><tspan fill="#969696">9 </tspan>RULES</text>
    <text x="577.1" y="190"><tspan fill="#969696">10 </tspan>SCHEDULE</text>
    <text x="705.0" y="190"><tspan fill="#969696">12a </tspan>OUTBOX</text>
  </g>

  <text x="28" y="248" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" fill="#E16C63"><tspan fill="#969696">R </tspan>OBSERVE</text>
  <text x="204" y="248">a refusal is written too, outside the transaction so it survives the rollback</text>

  <text x="28" y="272" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" fill="#F0F0F0"><tspan fill="#969696">11 </tspan>ARM<tspan fill="#969696">   12b </tspan>WAKE</text>
  <text x="204" y="272">outside the transaction, and awaited: the only I/O, and the last statement</text>
</svg>
