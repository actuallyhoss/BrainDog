blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability, privately
    url: https://github.com/actuallyhoss/BrainDog/security/advisories/new
    about: >
      Never in a public issue. This record holds credentials, and a public report is a working
      exploit handed to everybody before there is a fix. Private reporting gives us a fork to fix in
      and an advisory to publish from. Scope, timelines and safe harbour are in SECURITY.md.

  - name: The security model, before you report
    url: https://github.com/actuallyhoss/BrainDog/blob/master/docs/12-SECURITY.md
    about: >
      The threat model, the key hierarchy, and the list of things this project deliberately does not
      do: the operator can read a Cloud record with the vault passphrase off, the rows are not
      end-to-end encrypted, and there is no bug bounty. Each is a decision with its reasoning, not an
      oversight.

  - name: Ask a question about using BrainDog
    url: https://brain.dog/support
    about: >
      How to do something, your account, an invite or a bill. Write to support@brain.dog and a person
      answers. Issues here are for defects in the code and for work on it.

  - name: Read the docs
    url: https://brain.dog/docs
    about: >
      Using BrainDog, connecting Claude and other agents over MCP or the command line, the HTTP API,
      and writing plugins.

  - name: Read the design
    url: https://github.com/actuallyhoss/BrainDog/tree/master/docs
    about: >
      The numbered design documents. A request that cites the document it belongs in gets a far
      better answer.
