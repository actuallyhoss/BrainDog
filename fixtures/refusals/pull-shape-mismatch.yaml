# which no RPC call could make true. `40 §6`'s `rpc` runner seeds a record and makes a `call:`; a
# `PULL_` code is raised inside a scheduled connector run, by the runner the Worker's alarm and the
# self-host's timer drive, and is written onto that run's ack as `result.error`. Nothing a `call:`
# can express reaches it. The eighth `via` has its row in `40 §6` with `connect/test` as its runner,
# and the counts there moved with it: `rpc` 37 to 30, `pull` 7, still 115.
