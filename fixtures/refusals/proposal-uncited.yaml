# `via: ask` IS THE NINTH SURFACE, MADE FOR THESE FOUR, and not one of the
# eight before it could carry a Slash refusal. A `call:` seeds a record and invokes a method, and a
# `pack:` is a manifest read offline; a Slash refusal happens when a model ANSWERS, so the input is a
# projection plus the reply that came back. `40 §6` gives the row its keys and `slash/test` as the
# runner, which does not exist yet, in common with the other eight.
#
# THE `at` IS QUOTED BECAUSE THE VALUE IS BRACES, which unquoted YAML reads as a flow mapping. The
# header parser in `refusal-fixtures.mjs` strips one layer of quotes, so the address is the
# interpolation itself, which is what `packages/slash/src/project.ts:170` answers: `at: whole`, the
# whole span and not a position inside it.
#
# AND THE VALUE IS MEASURED RATHER THAN CHOSEN. `packages/slash/test/cite.test.ts:68` calls
# `cite('{{pct:-46.3}}', ALLOWED)` and asserts this code, because a computed percentage is the model
# quoting its own arithmetic and no row holds the answer to compare it against (`46 §5.7` step 3).
# The digit arm at line 135 addresses the same code differently, as the span around the bare digit,
# so this fixture covers one of the two shapes and a second fixture cannot cover the other: one code
# is one file.
#
# THE TWO REPLIES ARE PASS 1 AND PASS 2, and only the second is under test. The first is the
# predicate draft every ask spends before rows exist to talk about; the second cites a real row, so
# the proposal fails on the percentage alone and not on having no rows. Measured by
# `packages/slash/test/refusals-ask.test.ts`: with the span swapped for
# `{{obligations#7.amount}}`, a figure a row holds, the same reply is filed as `SG1`.
#
# THE SECOND OPTION WAS ADDED WHEN AN OPTIONS BODY GAINED ITS OWN SCHEMA (two to four options, each
# with an id, a label and a reason; `BODIES` in `packages/slash/src/prompts.ts`), so the body passes
# that check and the percentage is still the one fault. The measurement above is of the one-option
# reply before it.
