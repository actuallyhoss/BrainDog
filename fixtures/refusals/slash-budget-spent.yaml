# the eight runners drives. This code is the one of the four that refuses before the model is
# reached, and it is still an `ask`: the surface is the palette, and the meter is its first step
# (`46 §5.4` step 1). `40 §6` holds the row and the argument.
#
# NO `at:` AND ONLY THE IMPERATIVE HALF OF THE SENTENCE, both for that same reason. `spent()` at
