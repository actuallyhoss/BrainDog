# NO `at:`, BECAUSE THE ROUTER GIVES NONE. This once said `at: body`, until
# `packages/host/test/refusals-rpc.test.ts` drove it for the first time and `serveApi` answered
# `{ code, fix }` with no address. `41 §6` makes `at` optional, and a refusal with nothing to point at
# carries none; whether the router should say `body` is a change to the router and not to this file.
#
# AN ARRAY, NOT BROKEN TEXT. `[]` is valid JSON that is not an object, which is the half of the
# refusal a flow collection can carry; text that is not JSON at all takes the same `catch`.
