code:   PULL_EXPECT_FAILED
via:    rpc
raises: packages/connect/src/run.ts
at:     object
fix:    The server did not do what was asked: object was error, expected list; nothing was written.

# `via: rpc` IS NOT TRUE, AND THAT IS THE FINDING. No RPC call can reach this code. `40 §6`'s
# `rpc` runner seeds a record and makes a `call:`, and a `PULL_` code is raised inside a scheduled
# connector run, by the runner the Worker's alarm and the self-host's timer drive. The refusal is
# written onto that run's ack as `result.error` and is never handed back to a caller, so nothing a
# `call:` can express reaches it. The honest value is an eighth `via`, `pull`, driven from
# `connect/test`. A fixture cannot mint one: `40 §6`'s table is the registry this value is checked
# against, and five documents outside this directory count the `via`s as seven. That is a
# vocabulary change and a decision rather than a repair.
