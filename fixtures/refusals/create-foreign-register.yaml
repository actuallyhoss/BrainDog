code:   CREATE_FOREIGN_REGISTER
via:    install
raises: packages/kernel/src/declare.ts
at:     register
fix:    Generate only into a register this pack declares.
pack: {
    "pack": "fixture-install", "version": "1.0.0",
    "summary": "One pack built to trip exactly one install refusal.",
    "author": "BrainDog fixtures", "license": "MIT",
    "declarations": [
      { "register": "obligations", "name": "Obligations", "title": "what",
        "fields": [ { "id": "what", "type": "text", "required": true } ] },
      { "rule": "spawn-invoices", "register": "obligations", "once_per": [ "entry" ],
        "when": { "field": "what", "is": "x" },
        "then": [ { "create": { "register": "invoices", "bound": 10 } } ] }
    ]
  }
installed: [
    { "pack": "fixture-other", "version": "1.0.0",
      "summary": "The pack that already owns the register the rule writes into.",
      "author": "BrainDog fixtures", "license": "MIT",
      "declarations": [
        { "register": "invoices", "name": "Invoices", "title": "what",
          "fields": [ { "id": "what", "type": "text", "required": true } ] }
      ] }
  ]

# MOVED HERE FROM `lint`. The register the rule writes into belongs to another
# pack, and only a record knows who owns what: the `lint` runner overlays `owners` from the batch
# alone, so the same pack was ACCEPTED there, and on a fresh record it answers `REGISTER_UNKNOWN`
# because `invoices` does not exist. `once_per` is here because the kernel's install asks for one on
# any rule that creates rows, and the `lint` body had none: that check is not in `validate`, so the
# `lint` runner never met it.
