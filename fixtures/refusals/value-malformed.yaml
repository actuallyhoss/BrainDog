code:   VALUE_MALFORMED
via:    write
raises: packages/kernel/src/coerce.ts
at:     amount
fix:    Send a value the field's type can hold.
declare: {
    "id": "obligations", "name": "Obligations", "title": "what",
    "fields": [
      { "id": "what", "type": "text", "required": true },
      { "id": "amount", "type": "money" }
    ]
  }
rows: [
    { "what": "Invoice 41" }
  ]
write: { "register": "obligations", "seq": 1, "patch": { "amount": "GBP 41.00" } }
