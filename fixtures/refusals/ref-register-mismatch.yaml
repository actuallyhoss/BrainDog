code:   REF_REGISTER_MISMATCH
via:    write
raises: packages/kernel/src/coerce.ts
at:     thing
fix:    Name a row of the register this field points at, or change what it points at.
declare: {
    "id": "obligations", "name": "Obligations", "title": "what",
    "fields": [
      { "id": "what", "type": "text", "required": true },
      { "id": "thing", "type": "ref", "to": "obligations" }
    ]
  }
rows: [
    { "what": "Invoice 41" }
  ]
write: { "register": "obligations", "seq": 1, "patch": { "thing": "people#1" } }

# ONE REGISTER IS ENOUGH, AND THAT IS A FINDING ABOUT THE CHECK RATHER THAN ABOUT THE FIXTURE.
# `packages/kernel/src/coerce.ts:478` compares the register named IN THE REFERENCE against the
# field's `to:`, before asking whether either row exists. So a reference into a register the record
# has never heard of is refused for pointing at the wrong register, which is the right sentence:
# the fault is in the reference and not in the row it would have failed to find.
