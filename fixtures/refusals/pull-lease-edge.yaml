# `via: pull` IS THE SURFACE OF THESE SEVEN, and not `rpc`, which no RPC call could make true. `40 §6`'s `rpc` runner seeds a record and makes a `call:`; a
# `PULL_` code is raised inside a scheduled connector run, by the runner the Worker's alarm and the
# self-host's timer drive, and is written onto that run's ack as `result.error`. Nothing a `call:`
# can express reaches it. The eighth `via` has its row in `40 §6` with `connect/test` as its runner,
# and the counts there moved with it: `rpc` 37 to 30, `pull` 7, still 115.
#
# THE ONE ANSWER TAKES 290 SECONDS, and that is the whole fixture. The lease is five minutes and the
# run stops sixteen seconds short of it (the six-second page timeout and ten of slack), checked
# before each page and never during one. So the first page lands, the second is not asked for, and
# the run says why. With `ms` at 0 the run asks for a second page this fixture does not answer,
# measured by `packages/connect/test/refusals-pull.test.ts`.
