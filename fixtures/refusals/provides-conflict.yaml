code:   PROVIDES_CONFLICT
via:    install
raises: packages/declare/src/index.ts
at:     register.obligations
fix:    Retire the other pack's declaration first.
pack: {
    "pack": "fixture-install", "version": "1.0.0",
    "summary": "One pack built to trip exactly one install refusal.",
    "author": "BrainDog fixtures", "license": "MIT",
    "declarations": [
      { "register": "obligations", "name": "Obligations", "title": "what",
        "fields": [ { "id": "what", "type": "text", "required": true } ] }
    ]
  }
installed: [
    { "pack": "fixture-other", "version": "1.0.0",
      "summary": "The pack that already owns the register this one declares.",
      "author": "BrainDog fixtures", "license": "MIT",
      "declarations": [
        { "register": "obligations", "name": "Bills", "title": "what",
          "fields": [ { "id": "what", "type": "text", "required": true } ] }
      ] }
  ]
